<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yueliang</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Yueliang">
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f5f7fb;
            --sidebar: #e8edf7;
            --card: #ffffff;
            --text: #0f1e3d;
            --muted: #6a7a99;
            --accent: #1e3a8a;
            --accent-hover: #172a63;
            --accent-soft: #dde6f7;
            --line: #d4dced;
            --radius: 16px;
            --sidebar-width: 250px;
            --tabs-bg: #e2e8f4;
            --hover: rgba(30, 58, 138, 0.06);
            --danger: #b91c1c;
            --highlight: #fff3b0;
        }

        body.dark {
            --bg: #0a1226;
            --sidebar: #0f1a36;
            --card: #14203f;
            --text: #e2e8f7;
            --muted: #8291b3;
            --accent: #4a7bd4;
            --accent-hover: #5f8ee0;
            --accent-soft: #1a2a52;
            --line: #24315a;
            --tabs-bg: #0f1a36;
            --hover: rgba(120, 160, 220, 0.08);
            --danger: #ef4444;
            --highlight: #4a3d1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background 0.25s, color 0.25s;
            -webkit-font-smoothing: antialiased;
        }

        .layout { display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.22s ease, background 0.25s;
            overflow: hidden;
        }

        .sidebar.collapsed { width: 56px; }

        .sidebar-header {
            padding: 16px 14px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .sidebar-title-block { overflow: hidden; white-space: nowrap; }
        .sidebar-header h1 {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 2px;
            color: var(--accent);
        }
        .sidebar-header p {
            font-size: 0.66rem;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.08em;
        }

        .header-buttons { display: flex; gap: 4px; flex-shrink: 0; }

        .icon-btn {
            background: none;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            transition: 0.12s;
        }

        .icon-btn:hover { background: var(--hover); color: var(--accent); }
        .icon-btn.active { background: var(--accent); color: #fff; }

        .sidebar.collapsed .sidebar-title-block { display: none; }
        .sidebar.collapsed .sidebar-header { justify-content: center; padding: 16px 0 10px; flex-direction: column; }
        .sidebar.collapsed .header-buttons { flex-direction: column; }

        .sidebar-search { padding: 0 12px 10px; }
        .sidebar.collapsed .sidebar-search { display: none; }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 0.78rem;
            font-family: 'Roboto Mono', monospace;
            background: var(--card);
            color: var(--text);
            transition: 0.15s;
        }

        .search-input:focus { outline: none; border-color: var(--accent); }

        .sidebar-actions { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 6px; }
        .sidebar.collapsed .sidebar-actions { display: none; }

        .new-note-btn {
            width: 100%;
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            letter-spacing: 0.06em;
            transition: 0.15s;
        }

        .new-note-btn:hover { background: var(--accent-hover); }

        .export-btn {
            width: 100%;
            padding: 8px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            letter-spacing: 0.05em;
            transition: 0.15s;
        }

        .export-btn:hover { border-color: var(--accent); color: var(--accent); }

        .cat-list { flex: 1; overflow-y: auto; padding: 6px 8px; }

        .cat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 10px;
            margin-bottom: 2px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text);
            transition: 0.12s;
        }

        .cat-item:hover { background: var(--hover); }
        .cat-item.active { background: var(--accent); color: #fff; }
        .cat-item.dragging { opacity: 0.4; }
        .cat-item.drag-over { border-top: 2px solid var(--accent); margin-top: -2px; }

        .drag-handle { cursor: grab; font-size: 0.7rem; color: var(--muted); padding: 0 4px 0 0; user-select: none; flex-shrink: 0; }
        .cat-item.active .drag-handle { color: rgba(255,255,255,0.7); }

        .cat-item .cat-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cat-item .cat-count {
            font-size: 0.66rem;
            opacity: 0.55;
            margin-left: 8px;
            font-family: 'Roboto Mono', monospace;
        }

        .cat-item .del-cat {
            background: none; border: none; color: inherit; opacity: 0; cursor: pointer;
            font-size: 0.9rem; padding: 0 2px; margin-left: 4px; line-height: 1;
        }

        .cat-item:hover .del-cat { opacity: 0.5; }
        .cat-item .del-cat:hover { opacity: 1; color: #ff6b66; }

        .sidebar.collapsed .cat-item { justify-content: center; padding: 9px 0; font-size: 0.7rem; font-weight: 600; }
        .sidebar.collapsed .cat-item .cat-name { flex: none; max-width: 36px; text-align: center; letter-spacing: 0.5px; }
        .sidebar.collapsed .cat-item .cat-count,
        .sidebar.collapsed .cat-item .del-cat,
        .sidebar.collapsed .drag-handle { display: none; }

        .sidebar-footer { padding: 10px 12px 16px; border-top: 1px solid var(--line); }
        .sidebar.collapsed .sidebar-footer { display: none; }

        .add-cat-btn {
            width: 100%; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 10px;
            background: none; font-size: 0.72rem; cursor: pointer; font-family: inherit; color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .add-cat-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* MAIN */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .note-tabs {
            display: flex;
            align-items: center;
            background: var(--tabs-bg);
            border-bottom: 1px solid var(--line);
            padding: 0 8px;
            height: 40px;
            overflow-x: auto;
            overflow-y: hidden;
            flex-shrink: 0;
        }

        .note-tabs::-webkit-scrollbar { height: 3px; }
        .note-tabs::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

        .note-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px 7px 14px;
            margin: 0 2px;
            border-radius: 10px 10px 0 0;
            font-size: 0.74rem;
            font-weight: 500;
            cursor: pointer;
            background: transparent;
            color: var(--muted);
            white-space: nowrap;
            max-width: 200px;
            transition: 0.12s;
            border: 1px solid transparent;
            border-bottom: none;
            position: relative;
            top: 1px;
        }

        .note-tab:hover { background: var(--hover); }

        .note-tab.active {
            background: var(--bg);
            color: var(--accent);
            border-color: var(--line);
            font-weight: 700;
        }

        .note-tab .tab-name { overflow: hidden; text-overflow: ellipsis; max-width: 150px; }

        .note-tab .tab-close {
            background: none; border: none; color: inherit; opacity: 0.4;
            cursor: pointer; font-size: 0.9rem; padding: 0 2px; line-height: 1; border-radius: 3px;
        }

        .note-tab .tab-close:hover { opacity: 1; background: var(--hover); }

        .no-tabs { padding: 0 12px; font-size: 0.74rem; color: var(--muted); font-style: italic; }

        .main-scroll { flex: 1; overflow-y: auto; padding: 28px 32px 60px; }

        .main-inner { max-width: 680px; margin: 0 auto; }

        .countdown {
            background: var(--accent);
            color: #fff;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            display: inline-block;
            margin-bottom: 22px;
            font-family: 'Roboto Mono', monospace;
        }

        .main-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .main-header-text h2 {
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--accent);
        }
        .main-header-text p {
            font-size: 0.74rem;
            color: var(--muted);
            margin-top: 3px;
            font-weight: 500;
            letter-spacing: 0.03em;
            font-family: 'Roboto Mono', monospace;
        }

        .clear-search {
            font-size: 0.74rem; color: var(--accent); background: none; border: none;
            cursor: pointer; font-family: inherit; text-decoration: underline;
            font-weight: 600;
        }

        .subtabs {
            display: flex; flex-wrap: wrap; gap: 6px;
            margin-bottom: 20px; padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
            align-items: center;
        }

        .subtab {
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--line);
            background: var(--card);
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            color: var(--text);
            transition: 0.12s;
            display: flex;
            align-items: center;
            gap: 5px;
            user-select: none;
            letter-spacing: 0.02em;
        }

        .subtab:hover { background: var(--accent-soft); }

        .subtab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .subtab.dragging { opacity: 0.4; }
        .subtab.drag-over { border-left: 2px solid var(--accent); padding-left: 10px; }

        .subtab .subtab-count {
            opacity: 0.65;
            font-size: 0.66rem;
            font-family: 'Roboto Mono', monospace;
        }

        .subtab .del-subtab {
            background: none; border: none; color: inherit; opacity: 0;
            cursor: pointer; font-size: 0.85rem; padding: 0; margin-left: 2px; line-height: 1;
        }

        .subtab:hover .del-subtab { opacity: 0.5; }
        .subtab .del-subtab:hover { opacity: 1; color: #ff6b66; }

        .add-subtab {
            padding: 5px 12px; border-radius: 20px; border: 1px dashed var(--line);
            background: none; font-size: 0.72rem; cursor: pointer; font-family: inherit; color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .add-subtab:hover { border-color: var(--accent); color: var(--accent); }

        .note-list-item {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            flex-direction: column;
            gap: 6px;
            user-select: none;
        }

        .note-list-item:hover { border-color: var(--accent); transform: translateY(-1px); }

        .note-list-item.dragging { opacity: 0.4; }
        .note-list-item.drag-over { border-top: 2px solid var(--accent); margin-top: -2px; }

        .note-list-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .note-list-item .drag-handle {
            padding: 0 6px 0 0;
            align-self: center;
            opacity: 0.5;
        }

        .note-list-item .note-list-title {
            font-size: 0.96rem; font-weight: 600; flex: 1;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            letter-spacing: -0.01em;
            color: var(--accent);
        }

        .note-list-item .note-list-date {
            font-size: 0.68rem;
            color: var(--muted);
            white-space: nowrap;
            flex-shrink: 0;
            font-family: 'Roboto Mono', monospace;
        }

        .note-list-item .note-list-preview {
            font-size: 0.78rem; color: var(--muted);
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.5;
            font-family: 'Roboto Mono', monospace;
        }

        .note-list-item .note-list-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .note {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 28px 32px;
            margin-bottom: 18px;
        }

        .note-title {
            width: 100%; border: none;
            font-size: 1.5rem; font-weight: 700;
            font-family: 'Montserrat', sans-serif; color: var(--accent);
            padding: 0; margin-bottom: 6px;
            background: transparent;
            letter-spacing: -0.02em;
        }

        .note-title:focus { outline: none; }
        .note-title::placeholder { color: var(--muted); opacity: 0.5; }

        .note-date {
            font-size: 0.7rem;
            color: var(--muted);
            margin-bottom: 16px;
            font-family: 'Roboto Mono', monospace;
            letter-spacing: 0.04em;
            font-weight: 500;
        }

        .editor-toolbar {
            display: flex; flex-wrap: wrap; gap: 4px;
            padding: 8px 0;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            margin-bottom: 18px;
            align-items: center;
        }

        .editor-toolbar button {
            border: none;
            background: none;
            border-radius: 8px; padding: 6px 10px;
            font-size: 0.85rem;
            cursor: pointer; font-family: inherit;
            color: var(--text);
            min-width: 32px;
            transition: 0.12s;
            font-weight: 500;
        }

        .editor-toolbar button:hover { background: var(--hover); color: var(--accent); }

        .editor-toolbar .sep { width: 1px; background: var(--line); margin: 4px 4px; align-self: stretch; }

        .editor-toolbar input[type="color"] {
            width: 28px; height: 28px; border: none;
            border-radius: 8px; cursor: pointer; background: none; padding: 2px;
        }

        .word-count {
            margin-left: auto;
            font-size: 0.68rem;
            color: var(--muted);
            font-family: 'Roboto Mono', monospace;
            letter-spacing: 0.03em;
        }

        .note-body {
            min-height: 300px;
            font-size: 0.92rem;
            line-height: 1.85;
            font-family: 'Roboto Mono', monospace;
            padding: 0;
            outline: none;
            color: var(--text);
        }

        .note-body:empty:before { content: attr(data-placeholder); color: var(--muted); opacity: 0.5; }

        .note-body ul, .note-body ol { padding-left: 24px; margin: 8px 0; }
        .note-body li { margin: 4px 0; }

        .note-body blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 14px;
            margin: 10px 0;
            color: var(--muted);
            font-style: italic;
        }

        .note-body h1, .note-body h2, .note-body h3 {
            font-family: 'Montserrat', sans-serif;
            color: var(--accent);
            margin: 14px 0 6px;
            letter-spacing: -0.01em;
        }

        .note-body h1 { font-size: 1.4rem; }
        .note-body h2 { font-size: 1.15rem; }
        .note-body h3 { font-size: 1rem; }

        .note-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 24px; padding-top: 16px;
            border-top: 1px solid var(--line);
            font-size: 0.72rem; color: var(--muted); flex-wrap: wrap; gap: 8px;
        }

        .del-note {
            background: none;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--danger);
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            padding: 6px 12px;
            transition: 0.15s;
            letter-spacing: 0.06em;
        }

        .del-note:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

        .note-tags { display: flex; gap: 6px; flex-wrap: wrap; }

        .note-cat-tag, .note-sub-tag {
            font-size: 0.66rem; padding: 3px 10px; border-radius: 20px;
            background: var(--accent-soft); color: var(--accent);
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .note-sub-tag { background: var(--sidebar); color: var(--muted); }

        body.read-only .editor-toolbar,
        body.read-only .del-note,
        body.read-only .new-note-btn,
        body.read-only .add-cat-btn,
        body.read-only .add-subtab,
        body.read-only .del-cat,
        body.read-only .del-subtab,
        body.read-only .drag-handle,
        body.read-only .export-btn {
            display: none !important;
        }

        body.read-only .note-body,
        body.read-only .note-title {
            caret-color: transparent;
            pointer-events: none;
            user-select: text;
        }

        body.read-only .note-list-item { cursor: pointer; }

        .read-only-badge {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: var(--accent);
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            font-family: 'Roboto Mono', monospace;
            display: none;
            z-index: 100;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }

        body.read-only .read-only-badge { display: block; }

        .confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.15s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .confirm-box {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .confirm-box h3 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; color: var(--accent); }
        .confirm-box p { font-size: 0.8rem; color: var(--muted); margin-bottom: 20px; }
        .confirm-actions { display: flex; gap: 8px; }
        .confirm-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: 0.12s;
            letter-spacing: 0.04em;
        }
        .btn-cancel { background: var(--sidebar); color: var(--text); }
        .btn-cancel:hover { background: var(--line); }
        .btn-delete { background: var(--danger); color: #fff; }
        .btn-delete:hover { opacity: 0.9; }

        @media (max-width: 700px) {
            .layout { flex-direction: column; height: auto; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--line); }
            .sidebar.collapsed { width: 100%; }
            .sidebar.collapsed .sidebar-title-block,
            .sidebar.collapsed .sidebar-search,
            .sidebar.collapsed .sidebar-actions,
            .sidebar.collapsed .sidebar-footer { display: block; }
            .sidebar.collapsed .cat-item { justify-content: space-between; padding: 9px 10px; font-size: 0.82rem; font-weight: 500; }
            .sidebar.collapsed .cat-item .cat-name { flex: 1; max-width: none; text-align: left; letter-spacing: 0; }
            .sidebar.collapsed .cat-item .cat-count { display: inline; }
            .cat-list { max-height: 160px; }
            .main-scroll { padding: 20px 16px 60px; }
            .note { padding: 20px; }
            .note-title { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

<div class="layout">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title-block">
                <h1>Yueliang</h1>
                <p>NOV 2026</p>
            </div>
            <div class="header-buttons">
                <button class="icon-btn" id="readonly-btn" title="Read-only">👁</button>
                <button class="icon-btn" id="theme-btn" title="Dark mode">☾</button>
                <button class="icon-btn" id="collapse-btn" title="Collapse">«</button>
            </div>
        </div>

        <div class="sidebar-search">
            <input type="text" class="search-input" id="search-input" placeholder="Search…">
        </div>

        <div class="sidebar-actions">
            <button class="new-note-btn" id="new-note-btn">＋ NEW ENTRY</button>
            <button class="export-btn" id="export-btn">↓ EXPORT BACKUP</button>
            <button class="export-btn" id="import-btn">↑ IMPORT BACKUP</button>
        </div>

        const d = new Date(ts);
        const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
        return d.getDate().toString().padStart(2, "0") + " " + months[d.getMonth()] + " " + d.getFullYear();

        if (!text) return 0;
        return text.split(/\s+/).length;

    function confirmDialog(title, message, onConfirm) {
        const overlay = document.createElement("div");
        overlay.className = "confirm-overlay";
        const box = document.createElement("div");
        box.className = "confirm-box";
        box.innerHTML = `
            <h3>${title}</h3>
            <p>${message}</p>
            <div class="confirm-actions">
                <button class="btn-cancel">CANCEL</button>
                <button class="btn-delete">DELETE</button>
            </div>
        `;
        overlay.appendChild(box);
        document.body.appendChild(overlay);
        box.querySelector(".btn-cancel").addEventListener("click", () => overlay.remove());
        box.querySelector(".btn-delete").addEventListener("click", () => {
            overlay.remove();
            onConfirm();
        });
        overlay.addEventListener("click", (e) => {
            if (e.target === overlay) overlay.remove();
        });
    }
