<style>
:root{--bg:#f5f7fb;--sidebar:#ffffff;--card:#fff;--text:#0f1e3d;--muted:#6a7a99;--accent:#1e3a8a;--accent-hover:#172a63;--accent-soft:#dde6f7;--line:#d4dced;--radius:16px;--sidebar-width:280px;--tabs-bg:#e2e8f4;--hover:rgba(30,58,138,.06);--danger:#b91c1c}
body.dark{--bg:#0a1226;--sidebar:#0f1a36;--card:#14203f;--text:#e2e8f7;--muted:#8291b3;--accent:#4a7bd4;--accent-hover:#5f8ee0;--accent-soft:#1a2a52;--line:#24315a;--tabs-bg:#0f1a36;--hover:rgba(120,160,220,.08);--danger:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .25s,color .25s;-webkit-font-smoothing:antialiased}

.sidebar.open{transform:translateX(0)}
.sidebar-header{padding:20px 20px 8px}

.sidebar-header p{font-size:.7rem;color:var(--muted);font-weight:500;letter-spacing:.06em}
.sidebar-search{padding:8px 16px 12px}
.search-input{width:100%;padding:9px 16px;border:1px solid var(--line);border-radius:24px;font-size:.82rem;font-family:inherit;background:var(--bg);color:var(--text)}

.tree{flex:1;overflow-y:auto;padding:8px 12px 20px}

.tree-cat{margin-bottom:1px}
.tree-cat-head{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:24px;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--accent);transition:.12s;user-select:none;position:relative}
.tree-cat-head:hover{background:var(--accent-soft)}
.tree-cat-head.active{background:var(--accent-soft);color:var(--accent)}
.tree-cat-head.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--accent);border-radius:0 3px 3px 0}
.tree-cat-head .caret{width:14px;text-align:center;font-size:.68rem;opacity:.7;flex-shrink:0;color:var(--accent)}
.tree-cat-head .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-cat-head .count{font-size:.68rem;color:var(--accent);font-family:'Roboto Mono',monospace;font-weight:600;opacity:.75}
.tree-cat-head .del{background:none;border:none;color:inherit;opacity:0;cursor:pointer;font-size:.85rem;padding:0 2px;line-height:1}
.tree-cat-head:hover .del{opacity:.5}
.tree-cat-head .del:hover{opacity:1;color:#ff6b66}
.tree-sub{margin-left:14px}
.tree-sub-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:24px;font-size:.82rem;font-weight:500;cursor:pointer;color:var(--muted);transition:.12s;user-select:none;position:relative}
.tree-sub-head:hover{background:var(--accent-soft);color:var(--accent)}
.tree-sub-head.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tree-sub-head.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--accent);border-radius:0 3px 3px 0}
.tree-sub-head .caret{width:12px;text-align:center;font-size:.62rem;opacity:.5;flex-shrink:0}
.tree-sub-head .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tree-sub-head.active .count{color:var(--accent);opacity:.8}
.tree-sub-head .del{background:none;border:none;color:inherit;opacity:0;cursor:pointer;font-size:.8rem;padding:0 2px;line-height:1}
.tree-sub-head:hover .del{opacity:.5}
.tree-sub-head .del:hover{opacity:1;color:#ff6b66}
.tree-note{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 30px;border-radius:24px;font-size:.82rem;cursor:pointer;color:var(--text);transition:.12s;user-select:none}
.tree-note:hover{background:var(--accent-soft);color:var(--accent)}
.tree-note.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tree-note .dot{font-size:.45rem;opacity:.5;flex-shrink:0;color:var(--accent)}
.tree-note .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-note .del{background:none;border:none;color:inherit;opacity:0;cursor:pointer;font-size:.85rem;padding:0 2px;line-height:1}
.tree-note:hover .del{opacity:.5}

.note-tab .tab-name{overflow:hidden;text-overflow:ellipsis;max-width:150px}
.note-tab .tab-close{background:none;border:none;color:inherit;opacity:.4;cursor:pointer;font-size:.9rem;padding:0 2px;line-height:1;border-radius:3px}
.note-tab .tab-close:hover{opacity:1;background:var(--hover)}
.no-tabs{padding:0 12px;font-size:.74rem;color:var(--muted);font-style:italic}
.main-scroll{flex:1;overflow-y:auto;padding:28px 32px 60px}
.main-inner{max-width:680px;margin:0 auto}
.welcome{padding:80px 20px;text-align:center}
.welcome h2{font-size:1.9rem;font-weight:700;color:var(--accent);margin-bottom:14px;letter-spacing:-.02em}

.welcome .countdown{display:inline-block;background:var(--accent);color:#fff;padding:10px 18px;border-radius:12px;font-size:.75rem;font-weight:600;letter-spacing:.06em;font-family:'Roboto Mono',monospace;margin-bottom:36px}
.welcome .hint{font-size:.82rem;color:var(--muted);font-style:italic}
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px 32px;margin-bottom:18px}
.note-title{width:100%;border:none;font-size:1.5rem;font-weight:700;font-family:'Montserrat',sans-serif;color:var(--accent);padding:0;margin-bottom:6px;background:transparent;letter-spacing:-.02em}
.note-title:focus{outline:none}
.note-title::placeholder{color:var(--muted);opacity:.5}
.note-date{font-size:.7rem;color:var(--muted);margin-bottom:16px;font-family:'Roboto Mono',monospace;letter-spacing:.04em;font-weight:500}
.editor-toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:18px;align-items:center}
.editor-toolbar button{border:none;background:none;border-radius:8px;padding:6px 10px;font-size:.85rem;cursor:pointer;font-family:inherit;color:var(--text);min-width:32px;transition:.12s;font-weight:500}
.editor-toolbar button:hover{background:var(--hover);color:var(--accent)}
.editor-toolbar .sep{width:1px;background:var(--line);margin:4px 4px;align-self:stretch}
.editor-toolbar input[type="color"]{width:28px;height:28px;border:none;border-radius:8px;cursor:pointer;background:none;padding:2px}
.word-count{margin-left:auto;font-size:.68rem;color:var(--muted);font-family:'Roboto Mono',monospace;letter-spacing:.03em}
.note-body{min-height:300px;font-size:.92rem;line-height:1.85;font-family:'Roboto Mono',monospace;padding:0;outline:none;color:var(--text)}
.note-body:empty:before{content:attr(data-placeholder);color:var(--muted);opacity:.5}
.note-body ul,.note-body ol{padding-left:24px;margin:8px 0}
.note-body li{margin:4px 0}
.note-body blockquote{border-left:3px solid var(--accent);padding-left:14px;margin:10px 0;color:var(--muted);font-style:italic}
.note-body h1,.note-body h2,.note-body h3{font-family:'Montserrat',sans-serif;color:var(--accent);margin:14px 0 6px;letter-spacing:-.01em}
.note-body h1{font-size:1.4rem}
.note-body h2{font-size:1.15rem}
.note-body h3{font-size:1rem}

.del-note{background:none;border:1px solid var(--line);border-radius:8px;color:var(--danger);font-size:.7rem;font-weight:700;cursor:pointer;font-family:inherit;padding:6px 12px;transition:.15s;letter-spacing:.06em}
.del-note:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.note-tags{display:flex;gap:6px;flex-wrap:wrap}
.note-cat-tag,.note-sub-tag{font-size:.66rem;padding:3px 10px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:700;letter-spacing:.04em}
.note-sub-tag{background:var(--sidebar);color:var(--muted)}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.confirm-box{background:var(--card);border-radius:16px;padding:24px;max-width:320px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.confirm-box h3{font-size:1rem;font-weight:700;margin-bottom:8px;color:var(--accent)}
.confirm-box p{font-size:.8rem;color:var(--muted);margin-bottom:20px}
.confirm-actions{display:flex;gap:8px}
.confirm-actions button{flex:1;padding:10px;border-radius:10px;border:none;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.04em}
.btn-cancel{background:var(--sidebar);color:var(--text)}
.btn-cancel:hover{background:var(--line)}
.btn-delete{background:var(--danger);color:#fff}
.btn-delete:hover{opacity:.9}
.docs-overlay{position:fixed;inset:0;background:rgba(10,18,38,.55);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px;animation:fadeIn .15s ease}
.docs-overlay.open{display:flex}
.docs-modal{background:var(--card);border-radius:16px;max-width:720px;width:100%;max-height:85vh;display:flex;flex-direction:column;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.docs-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.docs-header h3{font-size:1.05rem;font-weight:700;color:var(--accent);letter-spacing:-.01em}
.docs-close{background:none;border:none;font-size:1.4rem;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px;border-radius:8px}
.docs-close:hover{background:var(--hover);color:var(--text)}
.docs-hint{font-size:.78rem;color:var(--muted);margin-bottom:14px;line-height:1.55}
.docs-output{flex:1;min-height:300px;padding:14px;border:1px solid var(--line);border-radius:12px;font-family:'Roboto Mono',monospace;font-size:.78rem;line-height:1.7;color:var(--text);background:var(--bg);resize:none;outline:none}
.docs-output:focus{border-color:var(--accent)}
.docs-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.docs-btn{padding:10px 16px;border-radius:10px;font-family:inherit;font-size:.76rem;font-weight:700;letter-spacing:.05em;cursor:pointer;transition:.12s;border:none}
.docs-btn.primary{background:var(--accent);color:#fff}
.docs-btn.primary:hover{background:var(--accent-hover)}
.docs-btn.secondary{background:var(--card);border:1px solid var(--line);color:var(--text)}
.docs-btn.secondary:hover{border-color:var(--accent);color:var(--accent)}
.docs-status{font-size:.72rem;color:var(--muted);margin-top:10px;min-height:1.1em;font-family:'Roboto Mono',monospace}
.docs-status.success{color:#1a7f37}
.docs-status.error{color:var(--danger)}
@media (max-width:700px){.main-scroll{padding:20px 16px 60px}.note{padding:20px}.note-title{font-size:1.25rem}.welcome h2{font-size:1.5rem}.welcome{padding:50px 16px}}
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<div class="layout">
<aside class="sidebar" id="sidebar">
<div class="sidebar-header">

</div>

<div class="sidebar-actions">
<button class="new-note-btn" id="new-note-btn">＋ 新建日记</button>

</div>

</div>

<script>
const JSONBIN_BIN_ID = "6aaa39f2ffd5d160530cf9dd";
const JSONBIN_MASTER_KEY = "$2a$10$YvRS1PtSNMPnFaFiLeT8F.jpSku64i138D8kcxx.bQQtTIJ9UtjAO";
const JSONBIN_API = "https://api.jsonbin.io/v3/b/" + JSONBIN_BIN_ID;
const STORAGE_KEY = "yueliang-journal-v2";
const OPEN_KEY = "yueliang-journal-open";
const EXPAND_KEY = "yueliang-expanded";
const LOCAL_TIME_KEY = "yueliang-last-modified";
let data = null;
let activeNoteId = null;
let openNoteIds = JSON.parse(localStorage.getItem(OPEN_KEY) || "[]");
let expandedCats = JSON.parse(localStorage.getItem(EXPAND_KEY) || "{}");
let searchTerm = "";
let syncTimeout = null;
let isSyncing = false;

function defaultData() {
  return {
    categories: [
      { id: "general", name: "日常", subtabs: [] },
      { id: "packing", name: "行李", subtabs: ["衣物", "电子", "证件"] },
      { id: "school", name: "学校", subtabs: [] }
    ],
    notes: [
      { id: Date.now(), categoryId: "general", subTab: "", title: "第一天 · 抵达", body: "<p>抵达上海。见到大家。<b>护照放在斜挎包里。</b></p>", created: Date.now() }
    ]
  };
}
function loadLocal() { const s = localStorage.getItem(STORAGE_KEY); if (s) { try { return JSON.parse(s); } catch(e) {} } return null; }
function getLocalTime() { return parseInt(localStorage.getItem(LOCAL_TIME_KEY) || "0", 10); }
function setLocalTime(ts) { localStorage.setItem(LOCAL_TIME_KEY, ts.toString()); }
function saveLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); setLocalTime(Date.now()); } catch(e) {} }
function saveOpen() { localStorage.setItem(OPEN_KEY, JSON.stringify(openNoteIds)); }
function saveExpanded() { localStorage.setItem(EXPAND_KEY, JSON.stringify(expandedCats)); }
function setSyncStatus(msg, cls) { const el = document.getElementById("sync-status"); if (!el) return; el.textContent = msg || ""; el.className = "sync-status" + (cls ? " " + cls : ""); }

async function loadFromCloud() {
  setSyncStatus("正在同步…", "syncing");
  let cloudData = null, cloudTime = 0;
  try {
    const res = await fetch(JSONBIN_API + "/latest", { headers: { "X-Master-Key": JSONBIN_MASTER_KEY }, cache: "no-store" });
    if (res.ok) { const json = await res.json(); const rec = json.record; if (rec && rec.categories && rec.notes) { cloudData = rec; cloudTime = rec._lastModified || 0; } }
    else throw new Error("HTTP " + res.status);
  } catch (e) {
    const local = loadLocal();
    if (local) { data = local; setSyncStatus("离线 — 使用本机副本", "offline"); }
    else { data = defaultData(); saveLocal(); setSyncStatus("离线 — 新建日记", "offline"); }
    return;
  }
  const local = loadLocal(); const localTime = getLocalTime();
  if (local && localTime > cloudTime) { data = local; await pushToCloud(); return; }
  if (cloudData) { data = cloudData; localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); setLocalTime(cloudTime || Date.now()); setSyncStatus("已同步", "saved"); setTimeout(() => setSyncStatus(""), 2000); return; }
  if (local) { data = local; setSyncStatus("使用本机副本", "offline"); }
  else { data = defaultData(); saveLocal(); await pushToCloud(); }
}

async function pushToCloud() {
  if (isSyncing) return;
  isSyncing = true;
  setSyncStatus("保存中…", "syncing");
  try {
    const now = Date.now(); data._lastModified = now;
    const res = await fetch(JSONBIN_API, { method: "PUT", headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_MASTER_KEY }, body: JSON.stringify(data) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    setLocalTime(now); setSyncStatus("已保存", "saved"); setTimeout(() => setSyncStatus(""), 2000);
  } catch (e) { setSyncStatus("离线 — 已存本机", "offline"); }
  finally { isSyncing = false; }
}

function save() {
  saveLocal();
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(() => { if (navigator.onLine) pushToCloud(); else setSyncStatus("离线 — 已存本机", "offline"); }, 800);
}

function formatDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日";
}

function countWords(html) {
  const tmp = document.createElement("div"); tmp.innerHTML = html || "";
  const text = (tmp.textContent || "").trim(); if (!text) return 0;
  const zh = (text.match(/[\u4e00-\u9fff]/g) || []).length;
  const en = text.replace(/[\u4e00-\u9fff]/g, " ").trim().split(/\s+/).filter(Boolean).length;
  return zh + en;
}
function stripHtml(html) { const tmp = document.createElement("div"); tmp.innerHTML = html || ""; return (tmp.textContent || "").trim(); }

function confirmDialog(title, msg, onConfirm) {
  const o = document.createElement("div"); o.className = "confirm-overlay";
  const b = document.createElement("div"); b.className = "confirm-box";
  b.innerHTML = '<h3>' + title + '</h3><p>' + msg + '</p><div class="confirm-actions"><button class="btn-cancel">取消</button><button class="btn-delete">删除</button></div>';
  o.appendChild(b); document.body.appendChild(o);
  b.querySelector(".btn-cancel").addEventListener("click", () => o.remove());
  b.querySelector(".btn-delete").addEventListener("click", () => { o.remove(); onConfirm(); });
  o.addEventListener("click", e => { if (e.target === o) o.remove(); });
}

function openNote(id) {
  if (!openNoteIds.includes(id)) openNoteIds.push(id);
  activeNoteId = id;
  saveOpen();
  renderTabs(); renderTree(); renderMain();
  if (window.innerWidth <= 900) closeSidebar();
}
function closeNoteTab(id, e) {
  if (e) e.stopPropagation();
  const idx = openNoteIds.indexOf(id); if (idx === -1) return;
  openNoteIds.splice(idx, 1);
  if (activeNoteId === id) activeNoteId = openNoteIds.length ? openNoteIds[openNoteIds.length - 1] : null;
  saveOpen(); renderTabs(); renderTree(); renderMain();
}
function renderTabs() {
  const bar = document.getElementById("note-tabs"); bar.innerHTML = "";
  if (openNoteIds.length === 0) { const m = document.createElement("span"); m.className = "no-tabs"; m.textContent = "☰ 打开一篇日记"; bar.appendChild(m); return; }
  openNoteIds.forEach(id => {
    const note = data.notes.find(n => n.id === id); if (!note) return;
    const t = document.createElement("div"); t.className = "note-tab" + (id === activeNoteId ? " active" : "");
    const n = document.createElement("span"); n.className = "tab-name"; n.textContent = note.title || "无标题";
    const c = document.createElement("button"); c.className = "tab-close"; c.textContent = "×";
    c.addEventListener("click", e => closeNoteTab(id, e));
    t.appendChild(n); t.appendChild(c);
    t.addEventListener("click", () => { activeNoteId = id; renderTabs(); renderTree(); renderMain(); });
    bar.appendChild(t);
  });
}

function renderTree() {
  const tree = document.getElementById("tree");
  tree.innerHTML = "";
  const labelHeader = document.createElement("div");
  labelHeader.className = "tree-label";
  labelHeader.textContent = "日记分类";
  tree.appendChild(labelHeader);
  const term = searchTerm.trim().toLowerCase();
  data.categories.forEach(cat => {
    const catNotes = data.notes.filter(n => n.categoryId === cat.id);
    const filteredCatNotes = term ? catNotes.filter(n => (n.title && n.title.toLowerCase().includes(term)) || (n.body && n.body.toLowerCase().includes(term))) : catNotes;
    if (term && filteredCatNotes.length === 0) return;

    const catEl = document.createElement("div"); catEl.className = "tree-cat";
    const head = document.createElement("div"); head.className = "tree-cat-head";
    const isExpanded = term ? true : (expandedCats[cat.id] !== false);
    head.innerHTML = '<span class="caret">' + (isExpanded ? '▾' : '▸') + '</span><span class="name">' + cat.name + '</span><span class="count">' + catNotes.length + '</span>';
    const delCat = document.createElement("button"); delCat.className = "del"; delCat.textContent = "×";
    delCat.addEventListener("click", e => {
      e.stopPropagation();
      confirmDialog("删除分类？", "「" + cat.name + "」及里面的日记都会被删除。", () => {
        data.categories = data.categories.filter(c => c.id !== cat.id);
        const removedIds = data.notes.filter(n => n.categoryId === cat.id).map(n => n.id);
        data.notes = data.notes.filter(n => n.categoryId !== cat.id);
        openNoteIds = openNoteIds.filter(id => !removedIds.includes(id));
        if (activeNoteId && !data.notes.some(n => n.id === activeNoteId)) activeNoteId = openNoteIds.length ? openNoteIds[openNoteIds.length - 1] : null;
        save(); saveOpen(); renderTree(); renderTabs(); renderMain();
      });
    });
    head.appendChild(delCat);
    head.addEventListener("click", () => {
      expandedCats[cat.id] = !isExpanded;
      saveExpanded(); renderTree();
    });
    catEl.appendChild(head);

    if (isExpanded) {
      const subWrap = document.createElement("div"); subWrap.className = "tree-sub";
      if (cat.subtabs && cat.subtabs.length > 0) {
        cat.subtabs.forEach(sub => {
          const subNotes = filteredCatNotes.filter(n => n.subTab === sub);
          const subHead = document.createElement("div"); subHead.className = "tree-sub-head";
          const subKey = cat.id + "/" + sub;
          const subExpanded = term ? true : (expandedCats[subKey] !== false);
          subHead.innerHTML = '<span class="caret">' + (subExpanded ? '▾' : '▸') + '</span><span class="name">' + sub + '</span><span class="count">' + subNotes.length + '</span>';
          const delSub = document.createElement("button"); delSub.className = "del"; delSub.textContent = "×";
          delSub.addEventListener("click", e => {
            e.stopPropagation();
            confirmDialog("删除子分类？", "「" + sub + "」将被删除。里面的日记会回到分类下。", () => {
              cat.subtabs = cat.subtabs.filter(s => s !== sub);
              data.notes.forEach(n => { if (n.categoryId === cat.id && n.subTab === sub) n.subTab = ""; });
              save(); renderTree();
            });
          });
          subHead.appendChild(delSub);
          subHead.addEventListener("click", () => {
            expandedCats[subKey] = !subExpanded; saveExpanded(); renderTree();
          });
          subWrap.appendChild(subHead);
          if (subExpanded) {
            subNotes.forEach(note => subWrap.appendChild(makeNoteRow(note)));
          }
        });
      }
      const noSubNotes = cat.subtabs && cat.subtabs.length > 0 ? filteredCatNotes.filter(n => !n.subTab) : filteredCatNotes;
      noSubNotes.forEach(note => subWrap.appendChild(makeNoteRow(note)));
      const addSub = document.createElement("div"); addSub.className = "tree-add-sub"; addSub.textContent = "＋ 子分类";
      addSub.addEventListener("click", () => {
        const name = prompt("新子分类名称：");
        if (!name || !name.trim()) return;
        if (!cat.subtabs) cat.subtabs = [];
        if (!cat.subtabs.includes(name.trim())) cat.subtabs.push(name.trim());
        save(); renderTree();
      });
      subWrap.appendChild(addSub);
      catEl.appendChild(subWrap);
    }
    tree.appendChild(catEl);
  });
}

function makeNoteRow(note) {
  const row = document.createElement("div");
  row.className = "tree-note" + (note.id === activeNoteId ? " active" : "");
  row.innerHTML = '<span class="dot">●</span><span class="name">' + (note.title || "无标题") + '</span>';
  const del = document.createElement("button"); del.className = "del"; del.textContent = "×";
  del.addEventListener("click", e => {
    e.stopPropagation();
    confirmDialog("删除日记？", "这篇日记将被永久删除。", () => {
      const id = note.id;
      data.notes = data.notes.filter(n => n.id !== id);
      openNoteIds = openNoteIds.filter(x => x !== id);
      if (activeNoteId === id) activeNoteId = openNoteIds.length ? openNoteIds[openNoteIds.length - 1] : null;
      save(); saveOpen(); renderTree(); renderTabs(); renderMain();
    });
  });
  row.appendChild(del);
  row.addEventListener("click", () => openNote(note.id));
  return row;
}

function renderMain() {
  const main = document.getElementById("main-inner");
  main.innerHTML = "";
  if (!activeNoteId) { renderWelcome(main); return; }
  const note = data.notes.find(n => n.id === activeNoteId);
  if (!note) { renderWelcome(main); return; }
  const card = document.createElement("div"); card.className = "note";
  const title = document.createElement("input"); title.className = "note-title"; title.type = "text";
  title.placeholder = "标题"; title.value = note.title;
  title.addEventListener("input", () => { note.title = title.value; save(); renderTabs(); renderTree(); });
  const dateEl = document.createElement("div"); dateEl.className = "note-date";
  dateEl.textContent = formatDate(note.created || note.id);
  const toolbar = document.createElement("div"); toolbar.className = "editor-toolbar";
  toolbar.innerHTML = '<button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="italic"><i>I</i></button><button type="button" data-cmd="underline"><u>U</u></button><button type="button" data-cmd="strikeThrough"><s>S</s></button><div class="sep"></div><button type="button" data-cmd="formatBlock" data-value="h1">H1</button><button type="button" data-cmd="formatBlock" data-value="h2">H2</button><button type="button" data-cmd="formatBlock" data-value="blockquote">"</button><div class="sep"></div><button type="button" data-cmd="insertUnorderedList">•</button><button type="button" data-cmd="insertOrderedList">1.</button><div class="sep"></div><button type="button" data-cmd="removeFormat">✕</button><input type="color" value="#1e3a8a"><span class="word-count" id="word-count"></span>';
  const body = document.createElement("div"); body.className = "note-body";
  body.contentEditable = "true"; body.setAttribute("data-placeholder", "写点什么…");
  body.innerHTML = note.body;
  body.addEventListener("input", () => { note.body = body.innerHTML; save(); updateWordCount(); });
  function updateWordCount() { const wc = document.getElementById("word-count"); if (wc) wc.textContent = countWords(note.body) + " 字"; }
  toolbar.querySelectorAll("button[data-cmd]").forEach(btn => {
    btn.addEventListener("mousedown", e => {
      e.preventDefault(); body.focus();
      if (btn.dataset.cmd === "formatBlock") document.execCommand("formatBlock", false, btn.dataset.value);
      else document.execCommand(btn.dataset.cmd, false, null);
      note.body = body.innerHTML; save(); updateWordCount();
    });
  });
  const colour = toolbar.querySelector('input[type="color"]');
  colour.addEventListener("input", e => { body.focus(); document.execCommand("foreColor", false, e.target.value); note.body = body.innerHTML; save(); });
  const footer = document.createElement("div"); footer.className = "note-footer";
  const tags = document.createElement("div"); tags.className = "note-tags";
  const catObj = data.categories.find(c => c.id === note.categoryId);
  const catTag = document.createElement("span"); catTag.className = "note-cat-tag"; catTag.textContent = catObj ? catObj.name : "";
  tags.appendChild(catTag);
  if (note.subTab) { const s = document.createElement("span"); s.className = "note-sub-tag"; s.textContent = note.subTab; tags.appendChild(s); }
  const del = document.createElement("button"); del.className = "del-note"; del.textContent = "删除日记";
  del.addEventListener("click", () => {
    confirmDialog("删除日记？", "这篇日记将被永久删除。", () => {
      const id = note.id;
      data.notes = data.notes.filter(n => n.id !== id);
      openNoteIds = openNoteIds.filter(x => x !== id);
      if (activeNoteId === id) activeNoteId = openNoteIds.length ? openNoteIds[openNoteIds.length - 1] : null;
      save(); saveOpen(); renderTree(); renderTabs(); renderMain();
    });
  });
  footer.appendChild(tags); footer.appendChild(del);
  card.appendChild(title); card.appendChild(dateEl); card.appendChild(toolbar); card.appendChild(body); card.appendChild(footer);
  main.appendChild(card);
  setTimeout(updateWordCount, 0);
}

function renderWelcome(main) {
  const w = document.createElement("div"); w.className = "welcome";
  const h = document.createElement("h2"); h.textContent = "月亮。写给十一月。";
  const p = document.createElement("p"); p.textContent = "一个用来记录上海的私人日记。";
  const cd = document.createElement("div"); cd.className = "countdown"; cd.id = "countdown"; cd.textContent = "倒计时…";
  const hint = document.createElement("div"); hint.className = "hint"; hint.textContent = "☰ 打开左边，选择或新建一篇日记。";
  w.appendChild(h); w.appendChild(p); w.appendChild(cd); w.appendChild(hint);
  main.appendChild(w);
  updateCountdown();
}

function updateCountdown() {
  const el = document.getElementById("countdown"); if (!el) return;
  const target = new Date("2026-11-01T00:00:00+08:00").getTime();
  const diff = target - Date.now();
  if (diff <= 0) { el.textContent = "该出发了 — 走吧！"; return; }
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const mins = Math.floor((diff / (1000 * 60)) % 60);
  el.textContent = days + " 天 · " + hours + " 时 · " + mins + " 分 到上海";
}

const menuBtn = document.getElementById("menu-btn");
const backdrop = document.getElementById("backdrop");
const sideEl = document.getElementById("sidebar");
function openSidebar(){ sideEl.classList.add("open"); backdrop.classList.add("show"); }
function closeSidebar(){ sideEl.classList.remove("open"); backdrop.classList.remove("show"); }
menuBtn.addEventListener("click", () => {
  if (sideEl.classList.contains("open")) closeSidebar(); else openSidebar();
});
backdrop.addEventListener("click", closeSidebar);

document.getElementById("new-note-btn").addEventListener("click", () => {
  if (searchTerm) { searchTerm = ""; document.getElementById("search-input").value = ""; }
  const firstCat = data.categories[0];
  const newNote = { id: Date.now(), categoryId: firstCat ? firstCat.id : "general", subTab: "", title: "", body: "", created: Date.now() };
  data.notes.unshift(newNote);
  expandedCats[newNote.categoryId] = true; saveExpanded();
  save(); renderTree(); renderTabs(); openNote(newNote.id);
});

document.getElementById("add-cat-btn").addEventListener("click", () => {
  const name = prompt("新分类名称：");
  if (!name || !name.trim()) return;
  const id = "cat-" + Date.now();
  data.categories.push({ id, name: name.trim(), subtabs: [] });
  expandedCats[id] = true; saveExpanded();
  save(); renderTree();
});

document.getElementById("search-input").addEventListener("input", e => { searchTerm = e.target.value; renderTree(); });

document.getElementById("export-btn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "yueliang-backup-" + new Date().toISOString().slice(0,10) + ".json"; a.click(); URL.revokeObjectURL(url);
});

document.getElementById("import-btn").addEventListener("click", () => {
  const input = document.createElement("input"); input.type = "file"; input.accept = ".json";
  input.addEventListener("change", e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const imported = JSON.parse(evt.target.result);
        if (imported.categories && imported.notes) {
          data = imported; save();
          openNoteIds = []; activeNoteId = null; saveOpen();
          renderTree(); renderTabs(); renderMain();
        }
      } catch (err) { alert("文件无效。"); }
    };
    reader.readAsText(file);
  });
  input.click();
});

function buildDocsText() {
  let text = "月亮 · Yueliang\n导出 " + formatDate(Date.now()) + "\n" + "=".repeat(60) + "\n\n";
  data.categories.forEach(cat => {
    const catNotes = data.notes.filter(n => n.categoryId === cat.id);
    text += "\n## " + cat.name.toUpperCase() + "\n" + "—".repeat(60) + "\n";
    if (catNotes.length === 0) { text += "（暂无日记）\n\n"; return; }
    catNotes.forEach(note => {
      const date = formatDate(note.created || note.id);
      const title = (note.title || "无标题").trim();
      const subTag = note.subTab ? "  [" + note.subTab + "]" : "";
      const body = stripHtml(note.body);
      text += "\n### " + title + subTag + "\n" + date + "\n\n" + (body || "（暂无内容）") + "\n\n";
    });
  });
  return text;
}

const docsOverlay = document.getElementById("docs-overlay");
const docsOutput = document.getElementById("docs-output");
const docsStatus = document.getElementById("docs-status");
document.getElementById("docs-btn").addEventListener("click", () => { docsOutput.value = buildDocsText(); docsStatus.textContent = ""; docsStatus.className = "docs-status"; docsOverlay.classList.add("open"); });
document.getElementById("docs-close").addEventListener("click", () => docsOverlay.classList.remove("open"));
docsOverlay.addEventListener("click", e => { if (e.target === docsOverlay) docsOverlay.classList.remove("open"); });
document.getElementById("docs-copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(docsOutput.value); docsStatus.textContent = "已复制。现在粘贴到 Google 文档。"; docsStatus.className = "docs-status success"; }
  catch (err) { docsOutput.select(); document.execCommand("copy"); docsStatus.textContent = "已复制（备用方式）。"; docsStatus.className = "docs-status success"; }
});
document.getElementById("docs-download").addEventListener("click", () => {
  const blob = new Blob([docsOutput.value], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "yueliang-journal-" + new Date().toISOString().slice(0,10) + ".txt"; a.click(); URL.revokeObjectURL(url);
  docsStatus.textContent = "已下载为 .txt"; docsStatus.className = "docs-status success";
});

window.addEventListener("online", () => { setSyncStatus("已连线 — 同步中…", "syncing"); if (data) pushToCloud(); });
window.addEventListener("offline", () => { setSyncStatus("离线 — 已存本机", "offline"); });

async function init() {
  await loadFromCloud();
  openNoteIds = openNoteIds.filter(id => data.notes.some(n => n.id === id));
  if (activeNoteId && !data.notes.some(n => n.id === activeNoteId)) activeNoteId = openNoteIds.length ? openNoteIds[openNoteIds.length - 1] : null;
  if (!activeNoteId && openNoteIds.length) activeNoteId = openNoteIds[openNoteIds.length - 1];
  renderTree(); renderTabs(); renderMain();
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
init();
</script>
</body>
