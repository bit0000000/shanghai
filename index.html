<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月亮 · Yueliang</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="月亮">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fb;--sidebar:#ffffff;--card:#fff;--text:#0f1e3d;--muted:#6a7a99;--accent:#1e3a8a;--accent-hover:#172a63;--accent-soft:#dde6f7;--line:#d4dced;--radius:16px;--sidebar-width:280px;--tabs-bg:#e2e8f4;--hover:rgba(30,58,138,.06);--danger:#b91c1c;--body-size:0.92rem}
body.dark{--bg:#0a1226;--sidebar:#0f1a36;--card:#14203f;--text:#e2e8f7;--muted:#8291b3;--accent:#4a7bd4;--accent-hover:#5f8ee0;--accent-soft:#1a2a52;--line:#24315a;--tabs-bg:#0f1a36;--hover:rgba(120,160,220,.08);--danger:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .25s,color .25s;-webkit-font-smoothing:antialiased}
.layout{display:flex;height:100vh;overflow:hidden;position:relative}
.backdrop{position:fixed;inset:0;background:rgba(10,18,38,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
.backdrop.show{opacity:1;pointer-events:auto}
.sidebar{position:fixed;top:0;left:0;bottom:0;z-index:100;transform:translateX(-100%);transition:transform .28s ease;width:var(--sidebar-width);max-width:85vw;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sidebar.open{transform:translateX(0)}
.sidebar-header{padding:20px 20px 6px}
.sidebar-header h1{font-size:1.2rem;font-weight:600;letter-spacing:-.01em;color:var(--accent);margin-bottom:2px}
.sidebar-header p{font-size:.7rem;color:var(--muted);font-weight:500;letter-spacing:.06em}
.icon-row{display:flex;gap:6px;padding:10px 20px 4px;flex-wrap:wrap}
.icon-btn{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--accent);transition:.12s;display:flex;align-items:center;gap:4px;line-height:1}
.icon-btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.icon-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sidebar-search{padding:10px 16px 8px;position:relative}
.search-input{width:100%;padding:9px 34px 9px 16px;border:1px solid var(--line);border-radius:24px;font-size:.82rem;font-family:inherit;background:var(--bg);color:var(--text)}
.search-input:focus{outline:none;border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px var(--accent-soft)}
.search-clear{position:absolute;right:22px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.05rem;line-height:1;padding:2px 7px;border-radius:6px;display:none;font-family:inherit}
.search-clear.show{display:block}
.search-clear:hover{color:var(--danger);background:var(--hover)}
.sidebar-actions{padding:4px 16px 10px;display:flex;flex-direction:column;gap:2px}
.new-note-btn{width:100%;padding:10px 16px;border:none;border-radius:24px;background:var(--accent);color:#fff;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;text-align:left;transition:.12s;box-shadow:0 2px 6px rgba(30,58,138,.2)}
.new-note-btn:hover{background:var(--accent-hover)}
.upload-btn{width:100%;padding:10px 16px;border:none;border-radius:24px;background:var(--accent-soft);color:var(--accent);font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;text-align:left;transition:.12s;margin-top:2px}
.upload-btn:hover{background:var(--accent);color:#fff}
.upload-btn.has-changes{background:#c77700;color:#fff}
.upload-btn.has-changes:hover{background:#a35f00}
.autosave-switch{width:100%;padding:9px 16px;border:1px solid var(--line);border-radius:24px;background:none;color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;text-align:left;transition:.12s;margin-top:2px;display:flex;align-items:center;gap:9px;letter-spacing:.02em}
.autosave-switch:hover{border-color:var(--accent);color:var(--accent)}
.autosave-switch .dot{width:8px;height:8px;border-radius:50%;background:#c4c4c0;transition:.2s;flex-shrink:0}
.autosave-switch.on{background:#e8f5e9;border-color:#1a7f37;color:#1a7f37}
.autosave-switch.on .dot{background:#1a7f37;box-shadow:0 0 0 3px rgba(26,127,55,.18)}
body.dark .autosave-switch.on{background:rgba(26,127,55,.14);color:#4ade80;border-color:#1a7f37}
body.dark .autosave-switch.on .dot{background:#4ade80}
.export-btn{width:100%;padding:9px 16px;border:none;border-radius:24px;background:none;color:var(--muted);font-size:.8rem;font-weight:500;cursor:pointer;font-family:inherit;text-align:left;transition:.12s}
.export-btn:hover{background:var(--accent-soft);color:var(--accent)}
.sync-status{font-size:.68rem;font-family:'Roboto Mono',monospace;color:var(--muted);padding:6px 4px 0;letter-spacing:.03em;min-height:1em;text-align:center}
.sync-status.syncing{color:var(--accent)}
.sync-status.saved{color:#1a7f37}
.sync-status.offline{color:#c77700}
.sync-status.error{color:var(--danger)}
.tree{flex:1;overflow-y:auto;padding:8px 12px 20px}
.tree-label{font-size:.68rem;font-weight:700;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;padding:14px 12px 6px;opacity:.8}
.tree-cat{margin-bottom:1px}
.tree-cat-head{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:24px;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--accent);transition:.12s;user-select:none;position:relative}
.tree-cat-head:hover{background:var(--accent-soft)}
.tree-cat-head.active{background:var(--accent-soft);color:var(--accent)}
.tree-cat-head.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--accent);border-radius:0 3px 3px 0}
.tree-cat-head .caret{width:14px;text-align:center;font-size:.68rem;opacity:.7;flex-shrink:0;color:var(--accent)}
.tree-cat-head .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-cat-head .count{font-size:.68rem;color:var(--accent);font-family:'Roboto Mono',monospace;font-weight:600;opacity:.75}
.tree-cat-head .add-note,.tree-sub-head .add-note{background:none;border:none;color:inherit;opacity:0;cursor:pointer;font-size:.85rem;padding:0 2px;line-height:1;font-weight:700}
.tree-cat-head:hover .add-note,.tree-sub-head:hover .add-note{opacity:.5}
.tree-cat-head .add-note:hover,.tree-sub-head .add-note:hover{opacity:1;color:#1a7f37}
.tree-cat-head .del{background:none;border:none;color:inherit;opacity:0;cursor:pointer;font-size:.85rem;padding:0 2px;line-height:1}
.tree-cat-head:hover .del{opacity:.5}
.tree-cat-head .del:hover{opacity:1;color:#ff6b66}
.tree-cat-head.drop-target{background:var(--accent);color:#fff}
.tree-cat-head.drop-target .count{color:#fff;opacity:.9}
.tree-cat-head.drop-target .caret{color:#fff}
.tree-sub{margin-left:14px}
.tree-sub-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:24px;font-size:.82rem;font-weight:500;cursor:pointer;color:var(--muted);transition:.12s;user-select:none;position:relative}
.tree-sub-head:hover{background:var(--accent-soft);color:var(--accent)}
.tree-sub-head.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tree-sub-head.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--accent);border-radius:0 3px 3px 0}
.tree-sub-head .caret{width:12px;text-align:center;font-size:.62rem;opacity:.5;flex-shrink:0}
.tree-sub-head .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-sub-head .count{font-size:.66rem;color:var(--muted);font-family:'Roboto Mono',monospace;font-weight:500}
.tree-sub-head.active .count{color:var(--accent);opacity:.8}
.tree-sub-head .del{background:none;border:none;color:inherit;opacity:0;cursor:pointer;font-size:.8rem;padding:0 2px;line-height:1}
.tree-sub-head:hover .del{opacity:.5}
.tree-sub-head .del:hover{opacity:1;color:#ff6b66}
.tree-sub-head.drop-target{background:var(--accent);color:#fff}
.tree-sub-head.drop-target .count{color:#fff;opacity:.9}
.tree-note{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 30px;border-radius:24px;font-size:.82rem;cursor:pointer;color:var(--text);transition:.12s;user-select:none}
.tree-note:hover{background:var(--accent-soft);color:var(--accent)}
.tree-note.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tree-note.dragging{opacity:.4}
.tree-note.drag-over{border-top:2px solid var(--accent);margin-top:-2px}
.tree-note .drag-h{font-size:.6rem;opacity:.35;flex-shrink:0;cursor:grab;color:var(--accent);letter-spacing:-1px}
.tree-note .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-note .del{background:none;border:none;color:inherit;opacity:0;cursor:pointer;font-size:.85rem;padding:0 2px;line-height:1}
.tree-note:hover .del{opacity:.5}
.tree-note .del:hover{opacity:1;color:#ff6b66}
.tree-add-sub{padding:7px 12px 7px 34px;font-size:.78rem;color:var(--muted);cursor:pointer;border-radius:24px;transition:.12s;font-weight:500}
.tree-add-sub:hover{background:var(--accent-soft);color:var(--accent)}
.tree-empty{padding:24px 16px;font-size:.78rem;color:var(--muted);text-align:center;font-style:italic}
mark{background:#ffe28a;color:inherit;padding:0 2px;border-radius:3px}
body.dark mark{background:#7a5c00;color:#fff}
.sidebar-footer{padding:10px 16px 16px;border-top:1px solid var(--line)}
.add-cat-btn{width:100%;padding:10px 16px;border:1px dashed var(--accent);border-radius:24px;background:none;font-size:.8rem;cursor:pointer;font-family:inherit;color:var(--accent);font-weight:600;text-align:left;transition:.12s}
.add-cat-btn:hover{background:var(--accent);color:#fff;border-style:solid}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;width:100%}
.main-topbar{display:flex;align-items:center;gap:6px;background:var(--tabs-bg);border-bottom:1px solid var(--line);padding:0 8px;height:44px;flex-shrink:0}
.menu-btn{background:none;border:none;font-size:1.2rem;color:var(--accent);cursor:pointer;padding:6px 10px;border-radius:8px;font-family:inherit;line-height:1;flex-shrink:0}
.menu-btn:hover{background:var(--hover)}
.main-topbar .note-tabs{flex:1;border-bottom:none;background:transparent;height:auto;padding:0}
.note-tabs{display:flex;align-items:center;overflow-x:auto;overflow-y:hidden}
.note-tabs::-webkit-scrollbar{height:3px}
.note-tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.tab-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:#c4c4c0;transition:background .2s}
.tab-dot.saved{background:#1a7f37}
.tab-dot.unsaved{background:#c77700}
.tab-dot.saving{background:var(--accent)}
.tab-dot.offline{background:#8e8e93}
.note-tab{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 14px;margin:0 2px;border-radius:8px;font-size:.74rem;font-weight:500;cursor:pointer;background:transparent;color:var(--muted);white-space:nowrap;max-width:200px;transition:.12s}
.note-tab:hover{background:var(--hover)}
.note-tab.active{background:var(--bg);color:var(--accent);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.note-tab .tab-name{overflow:hidden;text-overflow:ellipsis;max-width:150px}
.note-tab .tab-close{background:none;border:none;color:inherit;opacity:.4;cursor:pointer;font-size:.9rem;padding:0 2px;line-height:1;border-radius:3px}
.note-tab .tab-close:hover{opacity:1;background:var(--hover)}
.no-tabs{padding:0 12px;font-size:.74rem;color:var(--muted);font-style:italic}
.main-scroll{flex:1;overflow-y:auto;padding:28px 32px 60px}
.main-inner{max-width:680px;margin:0 auto}
.welcome{padding:80px 20px;text-align:center}
.welcome h2{font-size:1.9rem;font-weight:700;color:var(--accent);margin-bottom:14px;letter-spacing:-.02em}
.welcome p{font-size:.95rem;color:var(--muted);margin-bottom:32px}
.welcome .countdown{display:inline-block;background:var(--accent);color:#fff;padding:10px 18px;border-radius:12px;font-size:.75rem;font-weight:600;letter-spacing:.06em;font-family:'Roboto Mono',monospace;margin-bottom:36px}
.welcome .hint{font-size:.82rem;color:var(--muted);font-style:italic}
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px 32px;margin-bottom:18px}
.note-title{width:100%;border:none;font-size:1.5rem;font-weight:700;font-family:'Montserrat',sans-serif;color:var(--accent);padding:0;margin-bottom:6px;background:transparent;letter-spacing:-.02em}
.note-title:focus{outline:none}
.note-title::placeholder{color:var(--muted);opacity:.5}
.note-meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.note-select{font-family:inherit;font-size:.72rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border:1px solid transparent;border-radius:8px;padding:5px 10px;cursor:pointer;letter-spacing:.03em}
.note-select:hover{border-color:var(--accent)}
.note-select:focus{outline:none;border-color:var(--accent)}
.note-date{font-size:.7rem;color:var(--muted);margin-bottom:0;font-family:'Roboto Mono',monospace;letter-spacing:.04em;font-weight:500}
.editor-toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:18px;align-items:center}
.editor-toolbar button{border:none;background:none;border-radius:8px;padding:6px 10px;font-size:.85rem;cursor:pointer;font-family:inherit;color:var(--text);min-width:32px;transition:.12s;font-weight:500}
.editor-toolbar button:hover{background:var(--hover);color:var(--accent)}
.editor-toolbar .sep{width:1px;background:var(--line);margin:4px 4px;align-self:stretch}
.editor-toolbar input[type="color"]{width:28px;height:28px;border:none;border-radius:8px;cursor:pointer;background:none;padding:2px}
.word-count{margin-left:auto;font-size:.68rem;color:var(--muted);font-family:'Roboto Mono',monospace;letter-spacing:.03em}
.note-body{min-height:300px;font-size:var(--body-size);line-height:1.85;font-family:'Roboto Mono',monospace;padding:0;outline:none;color:var(--text)}
.note-body:empty:before{content:attr(data-placeholder);color:var(--muted);opacity:.55;font-style:italic}
.note-body ul,.note-body ol{padding-left:24px;margin:8px 0}
.note-body li{margin:4px 0}
.note-body blockquote{border-left:3px solid var(--accent);padding-left:14px;margin:10px 0;color:var(--muted);font-style:italic}
.note-body h1,.note-body h2,.note-body h3{font-family:'Montserrat',sans-serif;color:var(--accent);margin:14px 0 6px;letter-spacing:-.01em}
.note-body h1{font-size:1.4rem}
.note-body h2{font-size:1.15rem}
.note-body h3{font-size:1rem}
.note-footer{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted);flex-wrap:wrap;gap:8px}
.save-badge{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-family:'Roboto Mono',monospace;color:var(--muted);letter-spacing:.03em}
.save-badge .save-dot{width:7px;height:7px;border-radius:50%;background:#c4c4c0}
.save-badge.saved .save-dot{background:#1a7f37}
.save-badge.saved{color:#1a7f37}
.save-badge.unsaved .save-dot{background:#c77700}
.save-badge.unsaved{color:#c77700}
.save-badge.saving .save-dot{background:var(--accent)}
.save-badge.saving{color:var(--accent)}
.save-badge.offline .save-dot{background:#8e8e8e}
.save-badge.offline{color:#8e8e8e}
.footer-actions{display:flex;gap:6px;flex-wrap:wrap}
.copy-note{background:none;border:1px solid var(--line);border-radius:8px;color:var(--accent);font-size:.7rem;font-weight:700;cursor:pointer;font-family:inherit;padding:6px 12px;transition:.15s;letter-spacing:.06em}
.copy-note:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.del-note{background:none;border:1px solid var(--line);border-radius:8px;color:var(--danger);font-size:.7rem;font-weight:700;cursor:pointer;font-family:inherit;padding:6px 12px;transition:.15s;letter-spacing:.06em}
.del-note:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.note-tags{display:flex;gap:6px;flex-wrap:wrap}
.note-cat-tag,.note-sub-tag{font-size:.66rem;padding:3px 10px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:700;letter-spacing:.04em}
.note-sub-tag{background:var(--sidebar);color:var(--muted)}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.confirm-box{background:var(--card);border-radius:16px;padding:24px;max-width:340px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.confirm-box h3{font-size:1rem;font-weight:700;margin-bottom:8px;color:var(--accent)}
.confirm-box p{font-size:.8rem;color:var(--muted);margin-bottom:20px;line-height:1.55}
.confirm-actions{display:flex;gap:8px}
.confirm-actions button{flex:1;padding:10px;border-radius:10px;border:none;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.04em;transition:.12s}
.btn-cancel{background:var(--sidebar);color:var(--text)}
.btn-cancel:hover{background:var(--line)}
.btn-delete{background:var(--danger);color:#fff}
.btn-delete:hover{opacity:.9}
.btn-secondary{background:var(--sidebar);color:var(--muted);border:1px solid var(--line)}
.btn-secondary:hover{background:var(--line);color:var(--text)}
.btn-save{background:var(--accent);color:#fff}
.btn-save:hover{background:var(--accent-hover)}
.prompt-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:1100;padding:20px;animation:fadeIn .15s ease}
.prompt-overlay.open{display:flex}
.prompt-box{background:var(--card);border-radius:16px;padding:24px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.prompt-box h3{font-size:1rem;font-weight:700;margin-bottom:14px;color:var(--accent)}
.prompt-input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:.88rem;background:var(--bg);color:var(--text);margin-bottom:18px}
.prompt-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.prompt-actions{display:flex;gap:8px}
.prompt-actions button{flex:1;padding:10px;border-radius:10px;border:none;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.04em;transition:.12s}
.prompt-actions .btn-cancel{background:var(--sidebar);color:var(--text)}
.prompt-actions .btn-cancel:hover{background:var(--line)}
.prompt-actions .btn-ok{background:var(--accent);color:#fff}
.prompt-actions .btn-ok:hover{background:var(--accent-hover)}
.docs-overlay{position:fixed;inset:0;background:rgba(10,18,38,.55);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px;animation:fadeIn .15s ease}
.docs-overlay.open{display:flex}
.docs-modal{background:var(--card);border-radius:16px;max-width:720px;width:100%;max-height:85vh;display:flex;flex-direction:column;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.docs-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.docs-header h3{font-size:1.05rem;font-weight:700;color:var(--accent);letter-spacing:-.01em}
.docs-close{background:none;border:none;font-size:1.4rem;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px;border-radius:8px}
.docs-close:hover{background:var(--hover);color:var(--text)}
.docs-hint{font-size:.78rem;color:var(--muted);margin-bottom:14px;line-height:1.55}
.docs-output{flex:1;min-height:300px;padding:14px;border:1px solid var(--line);border-radius:12px;font-family:'Roboto Mono',monospace;font-size:.78rem;line-height:1.7;color:var(--text);background:var(--bg);resize:none;outline:none}
.docs-output:focus{border-color:var(--accent)}
.docs-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.docs-btn{padding:10px 16px;border-radius:10px;font-family:inherit;font-size:.76rem;font-weight:700;letter-spacing:.05em;cursor:pointer;transition:.12s;border:none}
.docs-btn.primary{background:var(--accent);color:#fff}

</div>
</div>

<div class="toast" id="toast"></div>
<script>
const JSONBIN_BIN_ID = "6aaa39f2ffd5d160530cf9dd";
const JSONBIN_MASTER_KEY = "$2a$10$cpuBUx97MmMS6302Tbum9uqxkqGuc56jFd0lPr1OaNOjMJmO6SMdW";
const JSONBIN_API = "https://api.jsonbin.io/v3/b/" + JSONBIN_BIN_ID;
const STORAGE_KEY = "yueliang-journal-v2";
const OPEN_KEY = "yueliang-journal-open";
const EXPAND_KEY = "yueliang-expanded";
const LOCAL_TIME_KEY = "yueliang-last-modified";
const FONT_KEY = "yueliang-fontsize";
const AUTOSAVE_KEY = "yueliang-autosave";
let data = null;
let activeNoteId = null;
let openNoteIds = JSON.parse(localStorage.getItem(OPEN_KEY) || "[]");
let expandedCats = JSON.parse(localStorage.getItem(EXPAND_KEY) || "{}");
let searchTerm = "";
let isSyncing = false;
let noteStatus = {};
let globalStatus = "saved";
let fontSize = localStorage.getItem(FONT_KEY) || "medium";
let autoSaveTimer = null;
const WRITING_PROMPTS = ["今天最开心的一件事是……","今天最难忘的一个人是……","今天吃到的最好吃的食物是……","今天让我有点惊讶的是……","今天我想记住的一个细节是……","今天和谁聊得最多？聊了什么？","今天有什么让我想家或想朋友？","今天看到的最好看的风景是……","今天学到的一件小事是……","如果用一句话总结今天，会是什么？","今天最累的一刻是……","今天让我笑出来的是……","今天有什么让我不舒服但我想记住的？","今天最想留住的一个瞬间是……"];
function getRandomPrompt() { return WRITING_PROMPTS[Math.floor(Math.random() * WRITING_PROMPTS.length)]; }
function applyFontSize() { const sizes = { small: "0.82rem", medium: "0.92rem", large: "1.05rem" }; document.documentElement.style.setProperty("--body-size", sizes[fontSize] || sizes.medium); }
function defaultData() { return { categories: [ { id: "general", name: "日常", subtabs: [] }, { id: "packing", name: "行李", subtabs: ["衣物", "电子", "证件"] }, { id: "school", name: "学校", subtabs: [] } ], notes: [ { id: Date.now(), categoryId: "general", subTab: "", title: "第一天 · 抵达", body: "<p>抵达上海。见到大家。<b>护照放在斜挎包里。</b></p>", created: Date.now() } ] }; }
function loadLocal() { const s = localStorage.getItem(STORAGE_KEY); if (s) { try { return JSON.parse(s); } catch(e) {} } return null; }
function getLocalTime() { return parseInt(localStorage.getItem(LOCAL_TIME_KEY) || "0", 10); }
function setLocalTime(ts) { localStorage.setItem(LOCAL_TIME_KEY, ts.toString()); }
function saveLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); setLocalTime(Date.now()); } catch(e) {} }
function saveOpen() { localStorage.setItem(OPEN_KEY, JSON.stringify(openNoteIds)); }
function saveExpanded() { localStorage.setItem(EXPAND_KEY, JSON.stringify(expandedCats)); }
function setSyncStatus(msg, cls) { const el = document.getElementById("sync-status"); if (!el) return; el.textContent = msg || ""; el.className = "sync-status" + (cls ? " " + cls : ""); }
function showToast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove("show"), 1800); }

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function highlightText(text,term){const safe=text||"";if(!term)return escapeHtml(safe);const lower=safe.toLowerCase(),t=term.toLowerCase(),i=lower.indexOf(t);if(i===-1)return escapeHtml(safe);return escapeHtml(safe.slice(0,i))+"<mark>"+escapeHtml(safe.slice(i,i+term.length))+"</mark>"+escapeHtml(safe.slice(i+term.length));}

let promptResolve = null;
function promptDialog(title, placeholder, defaultValue) {
  return new Promise(resolve => {
    promptResolve = resolve;
    document.getElementById("prompt-title").textContent = title;
    const input = document.getElementById("prompt-input");
    input.placeholder = placeholder || "";
    input.value = defaultValue || "";
    document.getElementById("prompt-overlay").classList.add("open");
    setTimeout(() => { input.focus(); input.select(); }, 60);
  });
}
function closePrompt(value) {
  const overlay = document.getElementById("prompt-overlay");
  if (!overlay.classList.contains("open")) return;
  overlay.classList.remove("open");
  const r = promptResolve; promptResolve = null;
  if (r) r(value);
}
document.getElementById("prompt-ok").addEventListener("click", () => closePrompt(document.getElementById("prompt-input").value.trim()));
document.getElementById("prompt-cancel").addEventListener("click", () => closePrompt(null));
document.getElementById("prompt-overlay").addEventListener("click", e => { if (e.target.id === "prompt-overlay") closePrompt(null); });
document.getElementById("prompt-input").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); closePrompt(e.target.value.trim()); }
  else if (e.key === "Escape") { e.preventDefault(); closePrompt(null); }
});

function confirmUnsaved(title, msg) {
  return new Promise(resolve => {
    const o = document.createElement("div");
    o.className = "confirm-overlay";
    const b = document.createElement("div");
    b.className = "confirm-box";
    b.innerHTML = '<h3>' + escapeHtml(title) + '</h3><p>' + escapeHtml(msg) + '</p><div class="confirm-actions"><button class="btn-cancel" data-act="cancel">取消</button><button class="btn-secondary" data-act="discard">不保存</button><button class="btn-save" data-act="save">保存</button></div>';
    o.appendChild(b);
    document.body.appendChild(o);
    const close = v => { o.remove(); resolve(v); };
    b.querySelector('[data-act="cancel"]').addEventListener("click", () => close("cancel"));
    b.querySelector('[data-act="discard"]').addEventListener("click", () => close("discard"));
    b.querySelector('[data-act="save"]').addEventListener("click", () => close("save"));
    o.addEventListener("click", e => { if (e.target === o) close("cancel"); });
  });
}

function hasUnsaved() {
  if (globalStatus === "unsaved" || globalStatus === "saving") return true;
  return Object.values(noteStatus).some(s => s === "unsaved" || s === "saving");
}

function updateUploadBtn() {
  const btn = document.getElementById("upload-btn");
  if (!btn) return;
  if (hasUnsaved()) btn.classList.add("has-changes");
  else btn.classList.remove("has-changes");
}

function updateSaveUI() {
  const st = (activeNoteId && noteStatus[activeNoteId]) || globalStatus || "saved";
  const badge = document.getElementById("current-save-badge");
  if (badge) {
    badge.className = "save-badge " + (st === "saved" ? "saved" : st === "unsaved" ? "unsaved" : st === "saving" ? "saving" : st === "offline" ? "offline" : "");
  }
  const txt = document.getElementById("current-save-badge-text");
  if (txt) {
    txt.textContent = st === "saved" ? "已保存到云端" : st === "unsaved" ? "未上传" : st === "saving" ? "上传中…" : st === "offline" ? "离线 — 仅本机" : "";
  }
  const tabs = document.querySelectorAll(".note-tab");
  tabs.forEach((tabEl, i) => {
    const id = openNoteIds[i];
    if (!id) return;
    const dot = tabEl.querySelector(".tab-dot");
    if (!dot) return;
    const s = noteStatus[id] || globalStatus || "saved";
    dot.className = "tab-dot " + (s === "saved" ? "saved" : s === "unsaved" ? "unsaved" : s === "saving" ? "saving" : s === "offline" ? "offline" : "");
  });
  updateUploadBtn();
}

async function loadFromCloud() {
  setSyncStatus("正在同步…", "syncing");
  let cloudData = null, cloudTime = 0;
  try { const res = await fetch(JSONBIN_API + "/latest", { headers: { "X-Master-Key": JSONBIN_MASTER_KEY }, cache: "no-store" }); if (res.ok) { const json = await res.json(); const rec = json.record; if (rec && rec.categories && rec.notes) { cloudData = rec; cloudTime = rec._lastModified || 0; } } else throw new Error("HTTP " + res.status); } catch (e) { const local = loadLocal(); if (local) { data = local; setSyncStatus("离线 — 使用本机副本", "offline"); globalStatus = "offline"; } else { data = defaultData(); saveLocal(); setSyncStatus("离线 — 新建日记", "offline"); globalStatus = "offline"; } return; }
  const local = loadLocal(); const localTime = getLocalTime();
  if (local && localTime > cloudTime) { data = local; await pushToCloud(); return; }
  if (cloudData) { data = cloudData; localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); setLocalTime(cloudTime || Date.now()); setSyncStatus("已同步", "saved"); globalStatus = "saved"; setTimeout(() => setSyncStatus(""), 2000); return; }
  if (local) { data = local; setSyncStatus("使用本机副本", "offline"); globalStatus = "offline"; } else { data = defaultData(); saveLocal(); await pushToCloud(); }
}

async function pushToCloud() {
  if (isSyncing) return;
  if (!navigator.onLine) { setSyncStatus("离线 — 无法上传", "offline"); globalStatus = "offline"; updateSaveUI(); return; }
  isSyncing = true; setSyncStatus("上传中…", "syncing");
  Object.keys(noteStatus).forEach(id => { if (noteStatus[id] === "unsaved" || noteStatus[id] === "offline") noteStatus[id] = "saving"; });
  updateSaveUI();
  try {
    const now = Date.now(); data._lastModified = now;
    const res = await fetch(JSONBIN_API, { method: "PUT", headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_MASTER_KEY }, body: JSON.stringify(data) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    setLocalTime(now);
    setSyncStatus("已上传", "saved");
    Object.keys(noteStatus).forEach(id => { noteStatus[id] = "saved"; });
    globalStatus = "saved";
    showToast("已上传到云端");
    setTimeout(() => setSyncStatus(""), 2000);
  } catch (e) {
    setSyncStatus("上传失败 — 已存本机", "offline");
    Object.keys(noteStatus).forEach(id => { if (noteStatus[id] === "saving") noteStatus[id] = "offline"; });
    globalStatus = "offline";
    showToast("上传失败");
  } finally { isSyncing = false; updateSaveUI(); }
}

function isAutoSaveOn() { return localStorage.getItem(AUTOSAVE_KEY) === "true"; }

function scheduleAutoSave() {
  if (!isAutoSaveOn()) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => {
    if (navigator.onLine && hasUnsaved() && !isSyncing) pushToCloud();
  }, 3000);
}

function save() {
  saveLocal();
  if (activeNoteId) noteStatus[activeNoteId] = "unsaved";
  globalStatus = "unsaved";
  updateSaveUI();
  scheduleAutoSave();
}

function formatDate(ts) { if (!ts) return ""; const d = new Date(ts); return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日"; }
function countWords(html) { const tmp = document.createElement("div"); tmp.innerHTML = html || ""; const text = (tmp.textContent || "").trim(); if (!text) return 0; const zh = (text.match(/[\u4e00-\u9fff]/g) || []).length; const en = text.replace(/[\u4e00-\u9fff]/g, " ").trim().split(/\s+/).filter(Boolean).length; return zh + en; }
function stripHtml(html) { const tmp = document.createElement("div"); tmp.innerHTML = html || ""; return (tmp.textContent || "").trim(); }
function confirmDialog(title, msg, onConfirm) { const o = document.createElement("div"); o.className = "confirm-overlay"; const b = document.createElement("div"); b.className = "confirm-box"; b.innerHTML = '<h3>' + title + '</h3><p>' + msg + '</p><div class="confirm-actions"><button class="btn-cancel">取消</button><button class="btn-delete">删除</button></div>'; o.appendChild(b); document.body.appendChild(o); b.querySelector(".btn-cancel").addEventListener("click", () => o.remove()); b.querySelector(".btn-delete").addEventListener("click", () => { o.remove(); onConfirm(); }); o.addEventListener("click", e => { if (e.target === o) o.remove(); }); }
function openNote(id) { if (!openNoteIds.includes(id)) openNoteIds.push(id); activeNoteId = id; if (!noteStatus[id]) noteStatus[id] = globalStatus === "offline" ? "offline" : (hasUnsaved() ? "unsaved" : "saved"); saveOpen(); renderTabs(); renderTree(); renderMain(); if (window.innerWidth <= 900) closeSidebar(); }

async function closeNoteTab(id, e) {
  if (e) e.stopPropagation();
  const idx = openNoteIds.indexOf(id);
  if (idx === -1) return;
  const st = noteStatus[id];
  if (st === "unsaved" || st === "offline") {
    const note = data.notes.find(n => n.id === id);
    const choice = await confirmUnsaved("未保存的日记", "「" + (note && note.title ? note.title : "无标题") + "」还没有上传到云端。要保存后再关闭吗？");
    if (choice === "cancel") return;
    if (choice === "save") {
      if (navigator.onLine) { await pushToCloud(); }
      else { showToast("离线 — 已存本机"); }
    }
  }
  openNoteIds.splice(idx, 1);
  if (activeNoteId === id) activeNoteId = openNoteIds.length ? openNoteIds[openNoteIds.length - 1] : null;
  saveOpen(); renderTabs(); renderTree(); renderMain();
}

function renderTabs() {
  const bar = document.getElementById("note-tabs"); bar.innerHTML = "";
  if (openNoteIds.length === 0) { const m = document.createElement("span"); m.className = "no-tabs"; m.textContent = "☰ 打开一篇日记"; bar.appendChild(m); return; }
  openNoteIds.forEach(id => {
    const note = data.notes.find(n => n.id === id); if (!note) return;
    const t = document.createElement("div"); t.className = "note-tab" + (id === activeNoteId ? " active" : "");
    const dot = document.createElement("span"); const st = noteStatus[id] || globalStatus || "saved";
    dot.className = "tab-dot " + (st === "saved" ? "saved" : st === "unsaved" ? "unsaved" : st === "saving" ? "saving" : st === "offline" ? "offline" : "");
    t.appendChild(dot);
    const n = document.createElement("span"); n.className = "tab-name"; n.textContent = note.title || "无标题";
    const c = document.createElement("button"); c.className = "tab-close"; c.textContent = "×";
    c.addEventListener("click", e => closeNoteTab(id, e));
    t.appendChild(n); t.appendChild(c);
    t.addEventListener("click", () => { activeNoteId = id; renderTabs(); renderTree(); renderMain(); });
    bar.appendChild(t);
  });
}
let draggingNoteId = null;
function clearDropTargets() { document.querySelectorAll(".drop-target").forEach(el => el.classList.remove("drop-target")); }
function renderTree() {
  const tree = document.getElementById("tree");
  tree.innerHTML = "";
  const labelHeader = document.createElement("div"); labelHeader.className = "tree-label"; labelHeader.textContent = "日记分类"; tree.appendChild(labelHeader);
  const term = searchTerm.trim().toLowerCase();
  data.categories.forEach(cat => {
    const catNotes = data.notes.filter(n => n.categoryId === cat.id);
    const filteredCatNotes = term ? catNotes.filter(n => (n.title && n.title.toLowerCase().includes(term)) || (n.body && n.body.toLowerCase().includes(term))) : catNotes;
    if (term && filteredCatNotes.length === 0) return;
    const catEl = document.createElement("div"); catEl.className = "tree-cat";
    const head = document.createElement("div"); head.className = "tree-cat-head";
    const isExpanded = term ? true : (expandedCats[cat.id] !== false);
    head.innerHTML = '<span class="caret">' + (isExpanded ? '▾' : '▸') + '</span><span class="name">' + cat.name + '</span><span class="count">' + catNotes.length + '</span>';
    const addNoteBtn = document.createElement("button");
    addNoteBtn.className = "add-note"; addNoteBtn.textContent = "＋"; addNoteBtn.title = "在这个分类下新建日记";
    addNoteBtn.addEventListener("click", e => { e.stopPropagation(); createNoteIn(cat.id, ""); });
    head.appendChild(addNoteBtn);
    const delCat = document.createElement("button"); delCat.className = "del"; delCat.textContent = "×";
    delCat.addEventListener("click", e => {
      e.stopPropagation();
      confirmDialog("删除分类？", "「" + cat.name + "」及里面的日记都会被删除。", () => {
        data.categories = data.categories.filter(c => c.id !== cat.id);
        const removedIds = data.notes.filter(n => n.categoryId === cat.id).map(n => n.id);
        data.notes = data.notes.filter(n => n.categoryId !== cat.id);
        openNoteIds = openNoteIds.filter(id => !removedIds.includes(id));
        if (activeNoteId && !data.notes.some(n => n.id === activeNoteId)) activeNoteId = openNoteIds.length ? openNoteIds[openNoteIds.length - 1] : null;
        save(); saveOpen(); renderTree(); renderTabs(); renderMain();
      });
    });
    head.appendChild(delCat);
    head.addEventListener("click", () => { expandedCats[cat.id] = !isExpanded; saveExpanded(); renderTree(); });
    head.addEventListener("dragover", e => { if (!draggingNoteId) return; e.preventDefault(); head.classList.add("drop-target"); });
    head.addEventListener("dragleave", () => head.classList.remove("drop-target"));
    head.addEventListener("drop", e => {
      e.preventDefault(); e.stopPropagation(); head.classList.remove("drop-target");
      if (!draggingNoteId) return;
      const note = data.notes.find(n => n.id === draggingNoteId); if (!note) return;
      note.categoryId = cat.id; note.subTab = ""; draggingNoteId = null;
      expandedCats[cat.id] = true; saveExpanded();
      save(); renderTree(); renderTabs(); renderMain();
      showToast("已移到「" + cat.name + "」");
    });
    catEl.appendChild(head);
    if (isExpanded) {
      const subWrap = document.createElement("div"); subWrap.className = "tree-sub";
      if (cat.subtabs && cat.subtabs.length > 0) {
        cat.subtabs.forEach(sub => {
          const subNotes = filteredCatNotes.filter(n => n.subTab === sub);
          const subHead = document.createElement("div"); subHead.className = "tree-sub-head";
          const subKey = cat.id + "/" + sub;
          const subExpanded = term ? true : (expandedCats[subKey] !== false);
          subHead.innerHTML = '<span class="caret">' + (subExpanded ? '▾' : '▸') + '</span><span class="name">' + sub + '</span><span class="count">' + subNotes.length + '</span>';
          const addNoteSub = document.createElement("button");
          addNoteSub.className = "add-note"; addNoteSub.textContent = "＋"; addNoteSub.title = "在这个子分类下新建日记";
          addNoteSub.addEventListener("click", e => { e.stopPropagation(); createNoteIn(cat.id, sub); });
          subHead.appendChild(addNoteSub);
          const delSub = document.createElement("button"); delSub.className = "del"; delSub.textContent = "×";
          delSub.addEventListener("click", e => {
            e.stopPropagation();
            confirmDialog("删除子分类？", "「" + sub + "」将被删除。里面的日记会回到分类下。", () => {
              cat.subtabs = cat.subtabs.filter(s => s !== sub);
              data.notes.forEach(n => { if (n.categoryId === cat.id && n.subTab === sub) n.subTab = ""; });
              save(); renderTree();
            });
          });
          subHead.appendChild(delSub);
          subHead.addEventListener("click", () => { expandedCats[subKey] = !subExpanded; saveExpanded(); renderTree(); });
          subHead.addEventListener("dragover", e => { if (!draggingNoteId) return; e.preventDefault(); subHead.classList.add("drop-target"); });
          subHead.addEventListener("dragleave", () => subHead.classList.remove("drop-target"));
          subHead.addEventListener("drop", e => {
            e.preventDefault(); e.stopPropagation(); subHead.classList.remove("drop-target");
            if (!draggingNoteId) return;
            const note = data.notes.find(n => n.id === draggingNoteId); if (!note) return;
            note.categoryId = cat.id; note.subTab = sub; draggingNoteId = null;
            expandedCats[cat.id] = true; expandedCats[subKey] = true; saveExpanded();
            save(); renderTree(); renderTabs(); renderMain();
            showToast("已移到「" + cat.name + " · " + sub + "」");
          });
          subWrap.appendChild(subHead);

function updateCountdown() {
  const el = document.getElementById("countdown"); if (!el) return;
  const target = new Date("2026-11-01T00:00:00+08:00").getTime();
  const diff = target - Date.now();
  if (diff <= 0) { el.textContent = "该出发了 — 走吧！"; return; }
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);

function buildDocsText() {
  let text = "月亮 · Yueliang\n导出 " + formatDate(Date.now()) + "\n" + "=".repeat(60) + "\n\n";
