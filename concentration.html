<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concentration · 专注力</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f7;--chat-bg:#ffffff;--header-bg:#ffffff;
  --text:#0f1e3d;--muted:#6a7a99;--accent:#1e3a8a;--accent-hover:#172a63;
  --accent-soft:#dde6f7;--line:#d4dced;
  --bubble-user:#1e3a8a;--bubble-user-text:#ffffff;
  --bubble-ai:#f0f3fa;--bubble-ai-text:#0f1e3d;
  --bubble-sys-bg:#e6ebf5;--bubble-sys-text:#4a5875;
  --danger:#b91c1c;--danger-soft:#fbe9e9;--success:#1a7f37;--success-soft:#e6f4ea;
}
body.dark{
  --bg:#070d1c;--chat-bg:#0f1a36;--header-bg:#0f1a36;
  --text:#e2e8f7;--muted:#8291b3;--accent:#4a7bd4;--accent-hover:#5f8ee0;
  --accent-soft:#1a2a52;--line:#24315a;
  --bubble-user:#4a7bd4;--bubble-user-text:#0a1226;
  --bubble-ai:#1a2a52;--bubble-ai-text:#e2e8f7;
  --bubble-sys-bg:#14203f;--bubble-sys-text:#8291b3;
  --danger:#ef4444;--danger-soft:rgba(239,68,68,.15);--success:#4ade80;--success-soft:rgba(74,222,128,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
  display:flex;justify-content:center;align-items:stretch;
  overflow:hidden;
}
.app{
  width:100%;max-width:720px;height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--chat-bg);
  transition:background .25s;
  position:relative;
}
@media (min-width:760px){
  .app{height:calc(100dvh - 32px);margin:16px 0;border-radius:20px;box-shadow:0 12px 40px rgba(15,30,61,.12);overflow:hidden}
  body.dark .app{box-shadow:0 12px 40px rgba(0,0,0,.5)}
}
.header{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:var(--header-bg);
  border-bottom:1px solid var(--line);
  flex-shrink:0;position:relative;z-index:2;
}
.header .title{font-size:.85rem;font-weight:700;color:var(--text);letter-spacing:-.01em;line-height:1.2}
.header .title small{display:block;font-size:.68rem;color:var(--muted);font-weight:500;letter-spacing:.05em}
.header .spacer{flex:1}
.round-pill{
  font-size:.7rem;font-weight:700;letter-spacing:.06em;
  background:var(--accent-soft);color:var(--accent);
  padding:5px 10px;border-radius:20px;font-family:'Roboto Mono',monospace;
}
.icon-btn{
  background:none;border:1px solid var(--line);border-radius:10px;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  color:var(--accent);font-size:1rem;cursor:pointer;transition:.15s;font-family:inherit;
}
.icon-btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.timer-bar{
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:16px 16px 12px;background:var(--header-bg);
  border-bottom:1px solid var(--line);flex-shrink:0;
}
.timer{
  font-family:'Roboto Mono',monospace;font-weight:600;
  font-size:3.2rem;line-height:1;color:var(--accent);letter-spacing:-.03em;
  min-width:130px;text-align:center;transition:color .2s;
  font-variant-numeric:tabular-nums;
}
.timer.warn{color:var(--danger)}
.timer.idle{color:var(--muted);opacity:.5}
.turn-label{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.chat{
  flex:1;overflow-y:auto;padding:20px 16px 8px;
  display:flex;flex-direction:column;gap:10px;
  background:var(--chat-bg);scroll-behavior:smooth;
}
.chat::-webkit-scrollbar{width:6px}
.chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.msg{max-width:80%;display:flex;flex-direction:column;gap:3px;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .bubble{padding:10px 14px;border-radius:18px;font-size:.92rem;line-height:1.5;word-break:break-word}
.msg .meta{font-size:.65rem;color:var(--muted);letter-spacing:.05em;padding:0 6px;font-weight:500}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.user .bubble{background:var(--bubble-user);color:var(--bubble-user-text);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;align-items:flex-start}
.msg.ai .bubble{background:var(--bubble-ai);color:var(--bubble-ai-text);border-bottom-left-radius:6px}
.msg.sys{align-self:center;align-items:center;max-width:90%}
.msg.sys .bubble{
  background:var(--bubble-sys-bg);color:var(--bubble-sys-text);
  font-size:.78rem;font-style:italic;padding:6px 14px;border-radius:14px;
  text-align:center;
}
.msg.bad .bubble{background:var(--danger-soft);color:var(--danger);font-weight:600}
.msg.good .bubble{background:var(--success-soft);color:var(--success);font-weight:600}
.round-sep{
  align-self:stretch;display:flex;align-items:center;gap:10px;
  color:var(--muted);font-size:.7rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;margin:10px 0 4px;
}
.round-sep::before,.round-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.input-bar{
  display:flex;gap:8px;padding:12px 16px 16px;
  background:var(--header-bg);border-top:1px solid var(--line);flex-shrink:0;
}
.input-bar input{
  flex:1;padding:12px 18px;border:1px solid var(--line);border-radius:24px;
  font-family:inherit;font-size:.92rem;background:var(--bg);color:var(--text);transition:.15s;
}
.input-bar input:focus{outline:none;border-color:var(--accent);background:var(--chat-bg);box-shadow:0 0 0 3px var(--accent-soft)}
.input-bar input:disabled{opacity:.5}
.send-btn{
  padding:0 22px;border:none;border-radius:24px;
  background:var(--accent);color:#fff;font-family:inherit;
  font-size:.85rem;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:.12s;
}
.send-btn:hover{background:var(--accent-hover)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:6px;padding:0 16px 12px;background:var(--header-bg);flex-shrink:0;flex-wrap:wrap}
.actions button{
  background:none;border:1px solid var(--line);border-radius:20px;
  padding:6px 12px;font-size:.72rem;font-weight:600;color:var(--muted);
  cursor:pointer;font-family:inherit;transition:.15s;letter-spacing:.03em;
}
.actions button:hover{border-color:var(--accent);color:var(--accent)}
.overlay{
  position:fixed;inset:0;background:rgba(10,18,38,.55);
  display:none;align-items:center;justify-content:center;
  padding:20px;z-index:100;backdrop-filter:blur(3px);animation:fadeIn .18s ease;
}
.overlay.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.topic-modal{
  width:100%;max-width:560px;max-height:85vh;
  background:var(--chat-bg);border-radius:20px;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.35);
}
.topic-head{padding:20px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.topic-head h2{font-size:1.05rem;font-weight:700;color:var(--accent);letter-spacing:-.01em}
.topic-head p{font-size:.75rem;color:var(--muted);margin-top:2px}
.topic-head .close{margin-left:auto;background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;padding:4px 8px;border-radius:8px;line-height:1}
.topic-head .close:hover{background:var(--bg);color:var(--text)}
.topic-search{padding:12px 20px 8px}
.topic-search input{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:24px;font-family:inherit;font-size:.85rem;background:var(--bg);color:var(--text)}
.topic-search input:focus{outline:none;border-color:var(--accent);background:var(--chat-bg)}
.topic-list{flex:1;overflow-y:auto;padding:8px 12px 16px;display:flex;flex-direction:column;gap:2px}
.topic-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:12px;cursor:pointer;
  font-size:.92rem;font-weight:500;color:var(--text);
  transition:.12s;font-family:inherit;text-align:left;background:none;border:none;width:100%;
}
.topic-row:hover{background:var(--accent-soft);color:var(--accent)}
.topic-row .count{margin-left:auto;font-size:.7rem;color:var(--muted);font-family:'Roboto Mono',monospace;font-weight:600}
.topic-row:hover .count{color:var(--accent)}
.countdown-modal{
  text-align:center;color:#fff;
  font-family:'Roboto Mono',monospace;font-weight:600;
  font-size:clamp(5rem,20vw,10rem);letter-spacing:-.04em;
  text-shadow:0 4px 30px rgba(0,0,0,.4);animation:pulseNum .9s ease;
}
@keyframes pulseNum{0%{transform:scale(.7);opacity:0}40%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
.over-modal{
  background:var(--chat-bg);border-radius:20px;
  padding:32px 28px;max-width:400px;width:100%;
  text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35);
}
.over-modal h2{font-size:1.4rem;color:var(--accent);margin-bottom:8px;letter-spacing:-.02em}
.over-modal p{font-size:.88rem;color:var(--muted);margin-bottom:22px;line-height:1.6}
.over-modal .stat{font-family:'Roboto Mono',monospace;font-size:.75rem;color:var(--muted);margin-bottom:20px;letter-spacing:.05em}
.over-modal .stat b{color:var(--accent);font-size:.95rem}
.over-modal .row{display:flex;gap:8px}
.over-modal button{flex:1;padding:12px;border-radius:12px;border:none;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:.12s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.appeal-modal{
  background:var(--chat-bg);border-radius:20px;
  padding:28px 24px;max-width:420px;width:100%;
  text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35);
}
.appeal-modal h3{font-size:1.1rem;color:var(--accent);margin-bottom:10px;letter-spacing:-.01em}
.appeal-modal .word{font-size:1.3rem;font-weight:700;color:var(--text);margin:10px 0;font-family:'Roboto Mono',monospace}
.appeal-modal p{font-size:.82rem;color:var(--muted);line-height:1.5;margin-bottom:14px}
.appeal-modal input{
  width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:14px;
  font-family:inherit;font-size:.9rem;background:var(--bg);color:var(--text);margin-bottom:14px;
}
.appeal-modal input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.appeal-modal .row{display:flex;gap:8px}
.appeal-modal button{flex:1;padding:12px;border-radius:12px;border:none;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:.12s}
.appeal-hint{font-size:.7rem;color:var(--muted);margin-top:10px;font-family:'Roboto Mono',monospace}
@media (max-width:520px){
  .timer{font-size:2.6rem;min-width:100px}
  .msg{max-width:88%}
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="title">Concentration<small>专注力</small></div>
    <div class="spacer"></div>
    <div class="round-pill" id="round-pill">Round —</div>
    <button class="icon-btn" id="theme-btn" title="Day / Night">☾</button>
  </div>

  <div class="timer-bar">
    <div class="timer idle" id="timer">10.0</div>
    <div class="turn-label" id="turn-label">Ready</div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-bar">
    <input type="text" id="answer-input" placeholder="Choose a topic to begin…" autocomplete="off" disabled>
    <button class="send-btn" id="submit-btn" disabled>Send</button>
  </div>
  <div class="actions">
    <button id="topic-btn">🎲 Change topic</button>
    <button id="used-btn">📋 Used words</button>
    <button id="quit-btn">✕ Quit</button>
  </div>
</div>

<div class="overlay" id="topic-overlay">
  <div class="topic-modal">
    <div class="topic-head">
      <div>
        <h2>Choose a topic</h2>
        <p>10 seconds per turn · no repeats · rounds until someone slips</p>
      </div>
      <button class="close" id="topic-close">×</button>
    </div>
    <div class="topic-search">
      <input type="text" id="topic-search-input" placeholder="Search topics…" autocomplete="off">
    </div>
    <div class="topic-list" id="topic-list"></div>
  </div>
</div>

<div class="overlay" id="countdown-overlay">
  <div class="countdown-modal" id="countdown-text">3</div>
</div>

<div class="overlay" id="gameover-overlay">
  <div class="over-modal">
    <h2 id="over-title">Game over</h2>
    <p id="over-reason"></p>
    <div class="stat" id="over-stat"></div>
    <div class="row">
      <button class="btn-ghost" id="back-btn">New topic</button>
      <button class="btn-primary" id="again-btn">Play again</button>
    </div>
  </div>
</div>

<div class="overlay" id="appeal-overlay">
  <div class="appeal-modal">
    <h3>申诉</h3>
    <p>你认为这个词应该算对吗？</p>
    <div class="word" id="appeal-word">xxx</div>
    <p>请输入这个词的意思（至少 5 个字）。通过后会加进你的个人词库，下次自动通过。</p>
    <input type="text" id="appeal-input" placeholder="它的意思是…" autocomplete="off">
    <div class="row">
      <button class="btn-ghost" id="appeal-cancel">放弃</button>
      <button class="btn-primary" id="appeal-submit">提交，继续</button>
    </div>
    <div class="appeal-hint" id="appeal-hint"></div>
  </div>
</div>

<!-- 词库 -->
<script src="vocab.js"></script>

<!-- 游戏逻辑 -->
<script>
let topicName = "";
let wordBank = [];
let used = new Set();
let currentTurn = "user";
let timerInterval = null;
let timeLeft = 10.0;
let gameActive = false;
let round = 0;
let totalAnswers = 0;
let countdownTimeout = null;
const TIME_LIMIT = 10.0;

// 用户个人词库
const USER_VOCAB_KEY = "concentration-user-vocab";
let userVocab = new Set(JSON.parse(localStorage.getItem(USER_VOCAB_KEY) || "[]"));
function saveUserVocab() {
  localStorage.setItem(USER_VOCAB_KEY, JSON.stringify(Array.from(userVocab)));
}

let appealPending = null;

// DOM
const chatEl         = document.getElementById("chat");
const inputEl        = document.getElementById("answer-input");
const submitBtn      = document.getElementById("submit-btn");
const timerEl        = document.getElementById("timer");
const turnLabel      = document.getElementById("turn-label");
const roundPill      = document.getElementById("round-pill");
const topicOverlay   = document.getElementById("topic-overlay");
const topicListEl    = document.getElementById("topic-list");
const topicSearchEl  = document.getElementById("topic-search-input");
const countdownOv    = document.getElementById("countdown-overlay");
const countdownText  = document.getElementById("countdown-text");
const gameoverOv     = document.getElementById("gameover-overlay");
const overTitle      = document.getElementById("over-title");
const overReason     = document.getElementById("over-reason");
const overStat       = document.getElementById("over-stat");
const themeBtn       = document.getElementById("theme-btn");
const appealOv       = document.getElementById("appeal-overlay");
const appealWordEl   = document.getElementById("appeal-word");
const appealInput    = document.getElementById("appeal-input");
const appealHint     = document.getElementById("appeal-hint");

// Theme
function applyTheme(){
  const stored = localStorage.getItem("concentration-theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const isDark = stored ? stored === "dark" : prefersDark;
  document.body.classList.toggle("dark", isDark);
  themeBtn.textContent = isDark ? "☀" : "☾";
}
themeBtn.addEventListener("click", () => {
  const isDark = !document.body.classList.contains("dark");
  document.body.classList.toggle("dark", isDark);
  themeBtn.textContent = isDark ? "☀" : "☾";
  localStorage.setItem("concentration-theme", isDark ? "dark" : "light");
});
applyTheme();

// Topic picker
function renderTopicList(filter){
  const q = (filter || "").trim().toLowerCase();
  topicListEl.innerHTML = "";
  Object.keys(TOPICS).forEach(name => {
    if (q && !name.toLowerCase().includes(q)) return;
    const btn = document.createElement("button");
    btn.className = "topic-row";
    btn.innerHTML = '<span>' + name + '</span><span class="count">' + TOPICS[name].length + '</span>';
    btn.addEventListener("click", () => {
      topicOverlay.classList.remove("open");
      beginCountdown(name);
    });
    topicListEl.appendChild(btn);
  });
}
topicSearchEl.addEventListener("input", e => renderTopicList(e.target.value));
document.getElementById("topic-btn").addEventListener("click", () => {
  renderTopicList("");
  topicSearchEl.value = "";
  topicOverlay.classList.add("open");
  setTimeout(() => topicSearchEl.focus(), 80);
});
document.getElementById("topic-close").addEventListener("click", () => topicOverlay.classList.remove("open"));
topicOverlay.addEventListener("click", e => { if (e.target === topicOverlay) topicOverlay.classList.remove("open"); });

// Countdown
function beginCountdown(name){
  topicName = name;
  wordBank = TOPICS[name] || [];
  used = new Set();
  round = 0;
  totalAnswers = 0;
  gameActive = false;
  chatEl.innerHTML = "";
  countdownText.textContent = "3";
  countdownText.style.animation = "none";
  void countdownText.offsetWidth;
  countdownText.style.animation = "pulseNum .9s ease";
  countdownOv.classList.add("open");
  inputEl.disabled = true;
  submitBtn.disabled = true;
  inputEl.value = "";
  inputEl.placeholder = "Get ready…";
  timerEl.textContent = "10.0";
  timerEl.classList.add("idle");
  timerEl.classList.remove("warn");
  turnLabel.textContent = "Ready";
  roundPill.textContent = "Round —";

  let n = 3;
  const tick = () => {
    n--;
    if (n > 0) {
      countdownText.textContent = String(n);
    } else if (n === 0) {
      countdownText.textContent = "GO!";
    } else {
      countdownOv.classList.remove("open");
      startGame();
      return;
    }
    countdownText.style.animation = "none";
    void countdownText.offsetWidth;
    countdownText.style.animation = "pulseNum .9s ease";
    countdownTimeout = setTimeout(tick, 800);
  };
  countdownTimeout = setTimeout(tick, 800);
}

// Chat helpers
function addMsg(text, kind, meta){
  const wrap = document.createElement("div");
  wrap.className = "msg " + kind;
  if (kind === "sys" && !meta) {
    wrap.innerHTML = '<div class="bubble">' + escapeHtml(text) + '</div>';
  } else {
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    wrap.appendChild(b);
    if (meta) {
      const m = document.createElement("div");
      m.className = "meta";
      m.textContent = meta;
      wrap.appendChild(m);
    }
  }
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function addBadge(text){
  const wrap = document.createElement("div");
  wrap.className = "msg sys bad";
  wrap.innerHTML = '<div class="bubble">❌ ' + escapeHtml(text) + '</div>';
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function addGood(text){
  const wrap = document.createElement("div");
  wrap.className = "msg sys good";
  wrap.innerHTML = '<div class="bubble">' + escapeHtml(text) + '</div>';
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function addRoundSep(n){
  const sep = document.createElement("div");
  sep.className = "round-sep";
  sep.textContent = "Round " + n;
  chatEl.appendChild(sep);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Timer
function startTimer(){
  clearInterval(timerInterval);
  timeLeft = TIME_LIMIT;
  timerEl.classList.remove("warn","idle");
  timerEl.textContent = timeLeft.toFixed(1);
  timerInterval = setInterval(() => {
    timeLeft -= 0.1;
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timeLeft = 0;
      timerEl.textContent = "0.0";
      timerEl.classList.add("warn");
      if (currentTurn === "user") endGame("You", "hesitation — 10 seconds ran out.");
      else endGame("AI", "hesitation.");
    } else {
      timerEl.textContent = timeLeft.toFixed(1);
      if (timeLeft <= 3) timerEl.classList.add("warn");
    }
  }, 100);
}
function stopTimer(){ clearInterval(timerInterval); }

// Game flow
function startGame(){
  currentTurn = "user";
  gameActive = true;
  round = 1;
  totalAnswers = 0;
  roundPill.textContent = "Round 1";
  addMsg("Topic: " + topicName, "sys");
  addMsg("You go first. 10 seconds per turn. No repeats.", "sys");
  addRoundSep(1);
  turnLabel.textContent = "Your turn";
  inputEl.disabled = false;
  submitBtn.disabled = false;
  inputEl.placeholder = "Type your answer…";
  inputEl.focus();
  startTimer();
}

function normalize(s){ return s.trim().toLowerCase().replace(/\s+/g, " "); }

function isChineseWordTopic() {
  return topicName.includes("华文");
}

function validateAnswer(raw) {
  if (isChineseWordTopic()) {
    const stripped = raw.trim().replace(/\s+/g, "");
    const isAllHanzi = /^[\u4e00-\u9fff]+$/.test(stripped);
    if (!isAllHanzi) return { ok: false, reason: "'" + raw.trim() + "' 必须是汉字。" };
    if (stripped.length !== 2) return { ok: false, reason: "'" + raw.trim() + "' 必须是两个字。" };
    return { ok: true, normalized: stripped };
  }
  return { ok: true, normalized: normalize(raw) };
}

function handleUserAnswer(){
  if (!gameActive || currentTurn !== "user") return;
  const raw = inputEl.value;
  if (!raw || !raw.trim()) return;

  stopTimer();
  inputEl.value = "";

  const validation = validateAnswer(raw);
  const ans = validation.normalized || normalize(raw);

  // 重复
  if (used.has(ans)) {
    addMsg(raw.trim(), "user", "You");
    addBadge("'" + raw.trim() + "' 已经说过了。");
    endGame("You", "repeated answer.");
    return;
  }

  // 中文格式错
  if (isChineseWordTopic() && !validation.ok) {
    addMsg(raw.trim(), "user", "You");
    addBadge(validation.reason);
    offerAppeal(raw.trim(), ans);
    return;
  }

  // 不在词库
  const inBank = wordBank.includes(ans);
  const inUserVocab = userVocab.has(ans);
  if (!inBank && !inUserVocab) {
    addMsg(raw.trim(), "user", "You");
    addBadge("'" + raw.trim() + "' 不在当前词库里。");
    offerAppeal(raw.trim(), ans);
    return;
  }

  // 通过
  used.add(ans);
  totalAnswers++;
  addMsg(raw.trim(), "user", "You");

  currentTurn = "ai";
  turnLabel.textContent = "AI thinking…";
  inputEl.disabled = true;
  submitBtn.disabled = true;
  setTimeout(aiTurn, 600);
}

// Appeal
function offerAppeal(displayWord, normalized) {
  appealPending = { display: displayWord, normalized };

  const wrap = document.createElement("div");
  wrap.className = "msg sys";
  wrap.innerHTML = `
    <div class="bubble" style="font-style:normal;">
      <div style="margin-bottom:8px;">这个词应该算对吗？</div>
      <div style="display:flex;gap:8px;justify-content:center;">
        <button id="appeal-trigger" style="padding:6px 14px;font-size:.72rem;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-weight:700;cursor:pointer;letter-spacing:.04em;">申诉</button>
        <button id="appeal-drop" style="padding:6px 14px;font-size:.72rem;border-radius:10px;border:1px solid var(--line);background:none;color:var(--text);font-family:inherit;font-weight:700;cursor:pointer;letter-spacing:.04em;">放弃</button>
      </div>
    </div>
  `;
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;

  wrap.querySelector("#appeal-trigger").addEventListener("click", () => {
    wrap.remove();
    openAppealModal();
  });
  wrap.querySelector("#appeal-drop").addEventListener("click", () => {
    wrap.remove();
    endGame("You", "答案被判错，未申诉。");
  });
}

function openAppealModal() {
  if (!appealPending) return;
  appealWordEl.textContent = appealPending.display;
  appealInput.value = "";
  appealInput.style.borderColor = "";
  appealHint.textContent = "";
  appealOv.classList.add("open");
  setTimeout(() => appealInput.focus(), 80);
}

function submitAppeal() {
  if (!appealPending) return;
  const meaning = appealInput.value.trim();
  if (meaning.length < 5) {
    appealInput.style.borderColor = "var(--danger)";
    appealHint.textContent = "请输入至少 5 个字。";
    appealHint.style.color = "var(--danger)";
    return;
  }
  userVocab.add(appealPending.normalized);
  saveUserVocab();
  appealOv.classList.remove("open");
  addGood("✅ '" + appealPending.display + "' 已加入你的个人词库");
  used.add(appealPending.normalized);
  totalAnswers++;
  appealPending = null;
  currentTurn = "ai";
  turnLabel.textContent = "AI thinking…";
  inputEl.disabled = true;
  submitBtn.disabled = true;
  setTimeout(aiTurn, 600);
}

function cancelAppeal() {
  if (!appealPending) return;
  appealOv.classList.remove("open");
  const word = appealPending.display;
  appealPending = null;
  endGame("You", "放弃申诉：" + word);
}

document.getElementById("appeal-submit").addEventListener("click", submitAppeal);
document.getElementById("appeal-cancel").addEventListener("click", cancelAppeal);
appealInput.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); submitAppeal(); }
  else if (e.key === "Escape") { e.preventDefault(); cancelAppeal(); }
});
appealOv.addEventListener("click", e => { if (e.target === appealOv) cancelAppeal(); });

// AI
function aiTurn(){
  if (!gameActive) return;
  const remaining = wordBank.filter(w => !used.has(normalize(w)));
  if (remaining.length === 0) {
    addMsg("AI has no more answers.", "sys");
    endGame("AI", "no more valid answers.");
    return;
  }
  const pick = remaining[Math.floor(Math.random() * remaining.length)];
  used.add(normalize(pick));
  totalAnswers++;
  addMsg(pick, "ai", "AI");
  round++;
  roundPill.textContent = "Round " + round;
  addRoundSep(round);
  currentTurn = "user";
  turnLabel.textContent = "Your turn";
  inputEl.disabled = false;
  submitBtn.disabled = false;
  inputEl.focus();
  startTimer();
}

function endGame(loser, reason){
  if (!gameActive) return;
  gameActive = false;
  stopTimer();
  inputEl.disabled = true;
  submitBtn.disabled = true;
  const winner = loser === "You" ? "AI" : "You";
  overTitle.textContent = winner + " win!";
  overReason.textContent = loser + " lost: " + reason;
  overStat.innerHTML = "Rounds: <b>" + round + "</b> · Words used: <b>" + used.size + "</b>";
  gameoverOv.classList.add("open");
  addMsg(winner + " win — " + loser + " lost: " + reason, "sys");
}

// Events
submitBtn.addEventListener("click", handleUserAnswer);
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); handleUserAnswer(); }
});
document.getElementById("quit-btn").addEventListener("click", () => {
  if (gameActive) endGame("You", "you quit.");
  else { gameoverOv.classList.remove("open"); topicOverlay.classList.add("open"); renderTopicList(""); }
});
document.getElementById("used-btn").addEventListener("click", () => {
  if (used.size === 0) { addMsg("No words used yet.", "sys"); return; }
  addMsg("Used so far: " + Array.from(used).join(", "), "sys");
});
document.getElementById("again-btn").addEventListener("click", () => {
  gameoverOv.classList.remove("open");
  if (topicName) beginCountdown(topicName);
});
document.getElementById("back-btn").addEventListener("click", () => {
  gameoverOv.classList.remove("open");
  renderTopicList("");
  topicSearchEl.value = "";
  topicOverlay.classList.add("open");
});

// Init
renderTopicList("");
topicOverlay.classList.add("open");
setTimeout(() => topicSearchEl.focus(), 200);
</script>
</body>
